<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE-21 프로젝트 산정·일정·성과관리 · 강의 슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--font:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--bar:#11132a;--bar2:#1c2046;--bd:#2e3460;--tx:#cfd3f0;--tx2:#8b90b0;--acc:#ff6b35}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root,.app{height:100%}
body{font-family:var(--font);background:#06070f;color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center;background:#06070f}
#frame{position:relative;width:min(100vw,calc((100vh - 58px) * 16 / 9));aspect-ratio:16/9;max-height:100%;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.nOn #stage{bottom:calc(58px + 30vh)}
.nOn #frame{width:min(100vw,calc((70vh - 58px) * 16 / 9))}
.edge{position:absolute;top:0;bottom:0;width:14%;border:none;background:transparent;cursor:pointer;z-index:5}
.edge.l{left:0}.edge.r{right:0;width:86%}
.edge:focus{outline:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--bar);border-top:1px solid var(--bd);display:flex;align-items:center;gap:9px;padding:0 12px;z-index:20}
#bar button{font-family:var(--font);font-size:13px;font-weight:700;color:var(--tx);background:var(--bar2);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{background:#262b5c;color:#fff}
#bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#bar button.home{border-color:#f7c948;color:#f7c948}
#bar button.home:hover{background:#f7c948;color:#1a1300}
#bar button:focus-visible{outline:2px solid #f7c948;outline-offset:2px}
#bar a.lnk{font-size:13px;font-weight:700;color:#7dd3fc;background:var(--bar2);border:1px solid #2f5d7a;border-radius:9px;padding:8px 13px;white-space:nowrap;text-decoration:none}
#bar a.lnk:hover{background:#7dd3fc;color:#06202e}
#bar a.lnk.on{background:var(--acc);border-color:var(--acc);color:#fff}
#idx{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;color:#fff;min-width:66px;text-align:center}
#ttl{color:var(--tx2);font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#ttl b{color:var(--tx)}
.hint{color:#5a5f86;font-size:12px;font-weight:600;white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;color:#fff;background:var(--bar2);border:1px solid var(--bd);border-radius:9px;padding:7px 12px}
#notes{position:fixed;left:0;right:0;bottom:58px;height:30vh;overflow:auto;background:#0f1126;border-top:2px solid var(--acc);padding:16px 26px 20px;z-index:19}
#notes .nh{font-size:12px;font-weight:800;letter-spacing:.08em;color:#8b90b0;margin-bottom:8px}
#notes ul{list-style:none;max-width:1200px}
#notes li{position:relative;padding:7px 0 7px 18px;font-size:17px;line-height:1.65;color:#dfe2f7;border-top:1px solid #23284f}
#notes li:first-child{border-top:none}
#notes li::before{content:'';position:absolute;left:2px;top:1.05em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
#notes ol.say{list-style:none;max-width:1400px;counter-reset:s}
#notes ol.say li{counter-increment:s;padding:8px 0 8px 46px;font-size:18px;line-height:1.6;color:#5f6489}
#notes ol.say li::before{content:counter(s);left:4px;top:10px;width:28px;height:28px;border-radius:14px;background:#23284f;color:#8b90b0;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
#notes ol.say li.past{color:#8f95bb}
#notes ol.say li.cur{color:#fff;font-size:23px;font-weight:700;line-height:1.55}
#notes ol.say li.cur::before{background:var(--acc);color:#fff}
#grid{position:fixed;inset:0;background:rgba(6,7,15,.97);z-index:40;padding:40px 5vw;overflow:auto}
#grid h3{color:#fff;font-size:20px;font-weight:900;margin-bottom:18px}
#grid .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#grid .it{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;border-radius:10px;border:2px solid #23284f;background:#141833;padding:11px 13px;font-family:var(--font)}
#grid .it.sec{border-left:7px solid #f7c948}
#grid .it.top{grid-column-start:1}
#grid .it:hover,#grid .it.cur{border-color:var(--acc)}
#grid .it .n{font-size:11px;font-weight:800;color:#f7c948;letter-spacing:.04em}
#grid .it .t{font-size:14px;font-weight:700;color:#e8eafa;line-height:1.35}
@media(max-width:1500px){.hint{display:none}}
.pub #info{display:none}
.pub #bar a.book{color:#1a1300;background:#f7c948;border-color:#f7c948}
.pub #bar a.book:hover{background:#ffd75e}
@media(max-width:1100px){.pub #bar .opt{display:none}}
@media(max-width:900px){.pub #ttl{visibility:hidden}}
@media(max-width:520px){.pub #bar .w{display:none}.pub #bar{gap:7px;justify-content:space-between}}
@media(max-width:900px) and (orientation:portrait){
.pub #stage{flex-direction:column;justify-content:flex-start;align-items:stretch;overflow:auto}
.pub #frame{width:100vw;max-height:none;flex:none}
.pub #info{display:block;padding:20px 18px 24px}
.pub #info .ik{font-size:12px;font-weight:800;color:#f7c948;letter-spacing:.02em;line-height:1.5}
.pub #info .it{font-size:19px;font-weight:800;color:#fff;margin-top:6px;line-height:1.4;word-break:keep-all}
.pub #info .is{font-size:13px;color:var(--tx2);margin-top:8px;font-variant-numeric:tabular-nums}
.pub #info .ic{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.pub #info .ic button{font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--tx);background:var(--bar2);border:1px solid var(--bd);border-radius:999px;padding:7px 12px;cursor:pointer}
.pub #info .ic button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pub #info .ih{font-size:12.5px;color:#6a6f96;margin-top:16px;line-height:1.6}}
@media(max-width:820px){.hint,#ttl{display:none}#bar{gap:6px;padding:0 8px}}
</style>
</head>
<body>
<div id="root"></div>
