<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZIP-UP 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>:root{--font:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.dot{width:10px;height:10px;border-radius:50%;background:#ff5c8a;flex:none}.dot.on{background:#86efac}
body{background:#0b0d1a;color:#e8eafa;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;min-height:100%;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;height:52px;flex:none}
header b{font-size:15px;font-weight:900;color:#f7c948;letter-spacing:.04em}
header .who{font-size:14px;font-weight:700;color:#8b90b0;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px 0}
.tag{font-size:15px;font-weight:900;color:#4ecdc4;letter-spacing:.08em}
.big{font-size:32px;font-weight:900;color:#fff;word-break:keep-all}
.huge{font-size:96px;font-weight:900;color:#f7c948;line-height:1;font-variant-numeric:tabular-nums}.huge small{font-size:36px;color:#8b90b0}
.sub{font-size:17px;font-weight:600;color:#c9cef0}
.note{font-size:14px;line-height:1.6;color:#8b90b0;font-weight:500;margin-top:8px;word-break:keep-all}
.card{margin-top:8vh;background:#141833;border:1px solid #2e3460;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:10px}
.card h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:6px}
label{font-size:13px;font-weight:800;color:#8b90b0;margin-top:6px}
input{font-family:var(--font);font-size:20px;font-weight:700;color:#fff;background:#0b0d1a;border:2px solid #2e3460;border-radius:12px;padding:13px 14px;width:100%;outline:none}
input:focus{border-color:#f7c948}
input.code{font-size:34px;font-weight:900;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums}
.err{font-size:14px;font-weight:700;color:#ff5c8a}
button{font-family:var(--font);cursor:pointer;touch-action:manipulation}
.primary{margin-top:10px;font-size:19px;font-weight:900;color:#1a1300;background:#f7c948;border:none;border-radius:14px;padding:15px}
.primary:disabled{opacity:.55}
.ghost{margin-top:14px;font-size:15px;font-weight:800;color:#c9cef0;background:transparent;border:2px solid #2e3460;border-radius:12px;padding:11px 20px}
.qhead{display:flex;align-items:center;gap:8px;margin-top:4px}
.qhead .no{font-size:15px;font-weight:900;color:#f7c948;border:2px solid #f7c948;border-radius:10px;padding:2px 10px}
.qhead .kind{font-size:14px;font-weight:900;color:#4ecdc4;border:2px solid #4ecdc4;border-radius:10px;padding:2px 10px}
.grow{flex:1}
.time{font-size:30px;font-weight:900;color:#4ecdc4;font-variant-numeric:tabular-nums;line-height:1}.time.hot{color:#ff5c8a}
.bar{height:8px;border-radius:4px;background:#1e2348;margin:10px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#4ecdc4;transition:width .2s linear}.bar i.hot{background:#ff5c8a}
h2{font-size:21px;font-weight:900;color:#fff;line-height:1.35;margin-bottom:10px;word-break:keep-all}
.prompt{background:rgba(247,201,72,.08);border-left:6px solid #f7c948;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.prompt p{font-size:18px;font-weight:600;line-height:1.6;color:#fff;word-break:keep-all}
.blank{display:inline-block;min-width:3.6em;text-align:center;margin:0 4px;padding:0 8px;border:2px dashed #f7c948;border-radius:8px;color:#f7c948;font-weight:900;line-height:1.35}
.blank.fill{border-color:#86efac;color:#86efac}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:17px;font-weight:800;color:#fff;background:rgba(247,201,72,.13);border:2px solid #f7c948;border-radius:10px;padding:5px 12px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;text-align:left;font-size:19px;font-weight:800;color:#fff;background:#141833;border:2px solid #2e3460;border-radius:16px;padding:12px 16px}
.choice:not(:disabled):active{background:#1b2046;border-color:#f7c948}
.choice .n{font-size:24px;font-weight:900;color:#f7c948;flex:none;line-height:1}
.choice .t{flex:1;word-break:keep-all;line-height:1.35}
.choice .m{font-size:13px;font-weight:900;flex:none}
.choice.sel{border-color:#f7c948;background:rgba(247,201,72,.14)}
.choice.right{border-color:#86efac;background:rgba(134,239,172,.14)}.choice.right .n,.choice.right .m{color:#86efac}
.choice.wrong{border-color:#ff5c8a;background:rgba(255,92,138,.14)}.choice.wrong .n,.choice.wrong .m{color:#ff5c8a}
.choice.dim{opacity:.45}
.status{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;line-height:1.55;word-break:keep-all;border:2px solid #2e3460;color:#c9cef0}
.status b{display:block;font-size:20px;font-weight:900;margin-bottom:2px}
.status.wait{border-color:#f7c948;color:#f7c948;background:rgba(247,201,72,.08);text-align:center}
.status.ok{border-color:#86efac;background:rgba(134,239,172,.1)}.status.ok b{color:#86efac}
.status.no{border-color:#ff5c8a;background:rgba(255,92,138,.1)}.status.no b{color:#ff5c8a}
.status.off{text-align:center}.status.off b{color:#f7c948}
.status .rate{font-size:14px;color:#8b90b0;margin-top:4px}
.score{display:flex;justify-content:space-between;margin-top:10px;background:#141833;border:1px solid #2e3460;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;color:#c9cef0}
.score b{font-size:20px;color:#f7c948}
.prompt.big p{font-size:22px;font-weight:800}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxb{flex-direction:column;justify-content:center;min-height:150px;gap:4px;text-align:center}
.oxb .sym{font-size:72px;font-weight:900;line-height:1}.oxb.o .sym{color:#4ecdc4}.oxb.x .sym{color:#ff6b35}
.oxb.right .sym{color:#86efac}.oxb.wrong .sym{color:#ff5c8a}
.oxb .t{flex:none}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #8b90b0;font-size:18px;font-weight:900;line-height:22px;text-align:center;color:#0b0d1a}
.box.on{background:#f7c948;border-color:#f7c948}.right .box{border-color:#86efac}.right .box.on{background:#86efac}.wrong .box.on{background:#ff5c8a;border-color:#ff5c8a}
.primary:disabled{opacity:.45}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#141833;border:2px solid #2e3460;border-radius:14px;padding:9px 12px;min-height:58px}
.row .t{flex:1;font-size:18px;font-weight:800;color:#fff;word-break:keep-all}
.row.ok{border-color:#86efac}.row.no{border-color:#ff5c8a}
.seg{display:flex;gap:6px;flex:none}
.seg button{font-size:15px;font-weight:900;border-radius:10px;padding:9px 12px;background:transparent;border:2px solid #2e3460;color:#c9cef0;min-width:68px}
.seg .b0{border-color:#4ecdc4;color:#4ecdc4}.seg .b1{border-color:#ff6b35;color:#ff6b35}
.seg .sel.b0{background:#4ecdc4;color:#0b0d1a}.seg .sel.b1{background:#ff6b35;color:#0b0d1a}
.seg .right{background:#86efac;border-color:#86efac;color:#0b0d1a}.seg .wrong{border-color:#ff5c8a;color:#ff5c8a}.seg .dim{opacity:.35}
.row.pair .arrow{flex:none;color:#8b90b0;font-weight:900}
.row.pair .t.r{text-align:right}.row.pair small{display:block;font-size:13px;font-weight:700;color:#ff5c8a}
.ends{font-size:13px;font-weight:800;color:#8b90b0;margin:2px 2px}
.slots{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.slot{display:flex;align-items:center;gap:10px;min-height:44px;border:2px dashed #2e3460;border-radius:12px;padding:6px 12px}
.slot .k{flex:none;width:22px;font-size:14px;font-weight:900;color:#8b90b0}
.slot .t{flex:1;font-size:17px;font-weight:800;color:#fff}
.slot.has{border-style:solid;border-color:#f7c948;background:rgba(247,201,72,.1)}
.slot.ok{border-style:solid;border-color:#86efac;background:rgba(134,239,172,.12)}
.slot.no{border-style:solid;border-color:#ff5c8a;background:rgba(255,92,138,.1)}
.slot .fix{flex:none;font-size:14px;font-weight:900;color:#86efac}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pool button{font-size:17px;font-weight:900;color:#fff;background:rgba(78,205,196,.1);border:2px solid #4ecdc4;border-radius:12px;padding:11px 16px}
.pool button:disabled{opacity:.22}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:end}
.two .ghost{margin-top:10px;padding:14px 10px}.two .ghost:disabled{opacity:.4}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:8px;min-height:58px;text-align:left;font-size:16px;font-weight:800;color:#fff;background:#141833;border:2px solid #2e3460;border-radius:14px;padding:8px 10px}
.mi .t{flex:1;word-break:keep-all;line-height:1.3}.mi .n{flex:none;font-size:20px;font-weight:900;line-height:1}
.mi.sel{border-color:#f7c948 !important;background:rgba(247,201,72,.16)}
.mi:disabled{opacity:.75}
.tip{font-size:13px;font-weight:700;color:#8b90b0;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
