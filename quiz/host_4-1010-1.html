<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>10/10 인터랙티브 퀴즈 · 세션 1 (SE-13~18 테스트·품질) · 진행자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>:root{--font:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.dot{width:10px;height:10px;border-radius:50%;background:#ff5c8a;flex:none}.dot.on{background:#86efac}
.app{height:100%}
body{background:#06070f;color:#cfd3f0;overflow:hidden}
#stage{position:fixed;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center;background:#06070f}
#frame{position:relative;width:min(100vw,calc((100vh - 58px) * 16 / 9));aspect-ratio:16/9;max-height:100%;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:#11132a;border-top:1px solid #2e3460;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:20}
#bar button{font-family:var(--font);font-size:13px;font-weight:700;color:#cfd3f0;background:#1c2046;border:1px solid #2e3460;border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{background:#262b5c;color:#fff}
#bar button.on{background:#ff6b35;border-color:#ff6b35;color:#fff}
#bar button.go{background:#f7c948;border-color:#f7c948;color:#1a1300;font-size:15px;font-weight:900;padding:9px 20px}
#bar button.go:hover{background:#ffd966}
#bar button:disabled{opacity:.5;cursor:default}
#bar button:focus-visible{outline:2px solid #f7c948;outline-offset:2px}
#idx{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;color:#fff;white-space:nowrap}
.cnt{font-size:13px;font-weight:800;color:#4ecdc4;white-space:nowrap}
#ttl{color:#8b90b0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#ttl .err{color:#ff5c8a}
.hint{color:#5a5f86;font-size:12px;font-weight:600;white-space:nowrap}
@media(max-width:900px){.hint{display:none}}
</style>
</head>
<body>
<div id="root"></div>
