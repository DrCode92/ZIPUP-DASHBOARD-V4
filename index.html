<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow, noarchive"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23FF6B35'/%3E%3Cstop offset='1' stop-color='%23F7C948'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8.5 9.6h15M8.5 22.4h15' stroke='%23141833' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M22.4 11.2L9.6 20.8' stroke='%23141833' stroke-width='4.2' stroke-dasharray='2 1.55'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#0B0D1A}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ZIP-UP 정보관리기술사 심화반</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 수험서 한 권을 펼친 화면. 왼쪽은 차례(계열 › 토픽), 오른쪽은 펼친 쪽이고 절 목차가 책갈피처럼 위에 붙어 다닌다.
   Color: 10/3 강의 슬라이드와 교재 지도의 색을 그대로 쓴다. 남색 바탕에 노랑(번호, 선택), 주황(주의), 청록(링크, 라벨), 보라(시험 포인트).
   어두운 화면이 기본이고, 밝게 보기를 누르면 같은 색 체계의 밝은 화면으로 바뀐다. */
:root{
  --paper:#0B0D1A; --paper-2:#11142A; --card:#141833; --ink:#F3F4FB; --ink-2:#C2C6E2; --ink-3:#8B90B0;
  --line:#2E3460; --line-2:#4A5188; --accent:#F7C948; --accent-bg:#2A2410; --on-accent:#1A1300;
  --blue:#4ECDC4; --blue-bg:#10302F; --r0:#9AA0C0; --r1:#FF6B35; --r2:#4ECDC4; --r3:#A78BFA; --r4:#FF5C8A;
  --sel:#F7C948; --on-sel:#1A1300; --on-ex:#062A27; --kw:#F7C948;
  --hl:rgba(247,201,72,.26); --glow:rgba(255,107,53,.09); --shade:rgba(0,0,0,.6); --zebra:rgba(127,127,160,.06);
  --f-body:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'Nanum Gothic Coding',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#F5F6FA; --paper-2:#E9EBF3; --card:#FFFFFF; --ink:#141833; --ink-2:#444A66; --ink-3:#6B7190;
  --line:#D5D8E6; --line-2:#A9AEC6; --accent:#B45309; --accent-bg:#FBEFD9; --on-accent:#FFFFFF;
  --blue:#0F766E; --blue-bg:#DDF3F0; --r0:#6B7190; --r1:#C2410C; --r2:#0F766E; --r3:#6D28D9; --r4:#BE185D;
  --sel:#F7C948; --on-sel:#1A1300; --on-ex:#FFFFFF; --kw:#B45309;
  --hl:rgba(246,196,60,.45); --glow:rgba(255,107,53,.07); --shade:rgba(20,24,51,.4); --zebra:rgba(20,24,51,.035);
  color-scheme:light;
}
*{box-sizing:border-box}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 100% 100%,var(--glow),transparent 62%) fixed,var(--paper)}
h1,h2,h3,h4,h5,p{margin:0}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* 위쪽 띠 */
.top{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#FF6B35,#F7C948 60%,transparent) 1}
.top-in{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px}
.brand{font-size:17px;font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.menu{display:flex;flex-wrap:wrap;gap:2px}
.menu > *{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;font-size:14.5px;text-decoration:none}
.menu .on{background:var(--sel);color:var(--on-sel);font-weight:800}
.menu .off{color:var(--ink-3)}
.grow{flex:1 1 0}
.mocknote{font-size:12.5px;color:var(--ink-3)}
.tbtn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--blue)}

/* 2단 */
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 80px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:40px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px);max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:thin;min-width:0}
.side summary{list-style:none;cursor:pointer;display:none;min-height:44px;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;font-weight:700}
.side summary::-webkit-details-marker{display:none}
.subj{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 12px;margin-bottom:8px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);font-size:14px;font-weight:800}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.fam{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;color:var(--ink-3)}
.fam small{margin-left:auto;font-family:var(--f-mono);font-size:11.5px}
button.fam{width:100%;border:0;background:none;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink-2)}
button.fam:hover{background:var(--paper-2);color:var(--ink)}
button.fam:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fam.open{color:var(--ink);font-weight:800;background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.fam svg{flex:none}
.tp{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px 0 30px;border-radius:8px;font-size:13.5px;text-decoration:none;color:var(--ink-2)}
.tp:hover{background:var(--paper-2);color:var(--ink)}
.tp span{flex:1 1 0;min-width:0;word-break:keep-all}
.tp[aria-current="page"]{background:var(--sel);color:var(--on-sel);font-weight:800}
.tp i{flex:none;font-style:normal;font-size:10.5px;font-weight:800;padding:0 5px;border-radius:4px;border:1px solid currentColor}
.tp i.must{color:var(--accent)}
.tp[aria-current="page"] i{color:var(--on-sel)}
.treefoot{padding:10px 10px 0;font-size:12px;color:var(--ink-3);line-height:1.5}

/* 토픽 머리 */
.main{min-width:0}
.crumb{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13px;color:var(--ink-3)}
.vhead{margin-top:6px;padding-bottom:12px;font-size:32px;font-weight:800;line-height:1.3;letter-spacing:-.01em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#FF6B35,#F7C948 60%,transparent) 1}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:800}
.chip.role{background:transparent;border:1px solid currentColor;font-weight:800}
.r0{color:var(--r0)} .r1{color:var(--r1)} .r2{color:var(--r2)} .r3{color:var(--r3)} .r4{color:var(--r4)}
.chip.must{background:transparent;border:1px solid var(--accent);color:var(--accent);font-weight:800}
.chip.id{background:transparent;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-inline:2px}
.chip.rev{background:transparent;border:1px dashed var(--line-2)}
.legacy{margin-top:14px;padding:10px 14px;border:1px dashed var(--line-2);border-radius:10px;font-size:13.5px;color:var(--ink-2)}
.tabrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;box-sizing:border-box;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:15px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.mini{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.mini a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12.5px;font-weight:700;text-decoration:none;color:var(--blue);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini a:hover{border-color:var(--blue)}

/* 절 목차 */
.toc{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;display:flex;gap:6px;overflow-x:auto;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
.toc button{all:unset;cursor:pointer;flex:none;box-sizing:border-box;min-height:36px;display:inline-flex;align-items:center;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.toc button:hover{border-color:var(--blue);color:var(--ink)}
.toc button[aria-current="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel);font-weight:800}
.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* 본문 */
.doc{max-width:820px}
.doc section{margin-top:48px;scroll-margin-top:68px}
.doc section:first-of-type{margin-top:28px}
.doc h2{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
.doc h2 i{flex:none;font-style:normal;font-family:var(--f-mono);font-size:15px;font-weight:700;color:var(--on-sel);background:var(--sel);width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.doc h2::after{content:'';flex:1;height:1px;background:var(--line)}
.doc h4{display:flex;align-items:baseline;gap:10px;font-size:18.5px;font-weight:800;margin:32px 0 12px;padding-left:12px;border-left:4px solid var(--sel)}
.doc h4 i{font-style:normal;font-family:var(--f-mono);font-size:13.5px;font-weight:700;color:var(--accent)}
.doc h5{font-size:16px;font-weight:800;margin:20px 0 8px;color:var(--blue)}
.doc p{font-size:16.5px;line-height:1.85;margin:0 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px;font-size:16px;line-height:1.8}
.doc li{margin:5px 0;word-break:keep-all;overflow-wrap:anywhere}
.doc li::marker{color:var(--ink-3)}
.doc strong{font-weight:800;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 1px}
.doc th strong,.doc .lab strong{background:none}
.doc p.defp{font-size:17.5px;font-weight:600;line-height:1.8;padding:14px 18px;border-radius:12px;background:var(--accent-bg);border-left:5px solid var(--accent)}
.xref{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.doc strong .xref{font-weight:800}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0 18px;background:var(--card)}
table{border-collapse:collapse;width:100%}
.tw table{font-size:14.5px;line-height:1.6}
.tw th,.tw td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;word-break:keep-all;overflow-wrap:break-word}
.tw tr:last-child td{border-bottom:none}
.tw th{background:var(--paper-2);color:var(--accent);font-size:13.5px;font-weight:800;white-space:nowrap}
.tw td{min-width:84px}
.tw td:first-child{font-weight:700}
.tw tbody tr:nth-child(even) td{background:var(--zebra)}
.doc pre{position:relative;margin:14px 0 18px;padding:30px 16px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.6}
.doc pre::before{content:'코드 예';position:absolute;left:14px;top:8px;font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.doc pre code{all:unset;font-family:inherit;white-space:pre}
.doc code{font-family:var(--f-mono);font-size:14px;background:var(--paper-2);padding:1px 6px;border-radius:5px}
.callout{--cl:var(--accent);--on-cl:var(--on-accent);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;margin:16px 0 18px;padding:13px 16px;border-radius:12px;border:1px solid var(--cl);background:color-mix(in srgb,var(--cl) 9%,var(--card))}
.callout .lab{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--on-cl);background:var(--cl);border-radius:6px;padding:2px 9px;white-space:nowrap;margin-top:3px}
.callout .cb p{margin:0;font-size:16px;line-height:1.75}
.callout.key{--cl:var(--accent);--on-cl:var(--on-accent);background:var(--accent-bg)}
.callout.warn{--cl:var(--r1);--on-cl:#FFFFFF}
.callout.exam{--cl:var(--r3);--on-cl:#FFFFFF}
.callout.ex{--cl:var(--r2);--on-cl:var(--on-ex)}
.doc ul.kv{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:12px 0 18px}
.doc ul.kv li{margin:0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.doc ul.kv li b{font-size:15px;font-weight:800;color:var(--blue)}
.doc ul.kv li span{font-size:15px;line-height:1.65}
.docmeta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:28px;font-size:13px;color:var(--ink-3)}

/* 연결, 문항 */
.box{margin-top:26px;border:1px solid var(--line-2);border-radius:14px;background:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.box-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.box-h b{font-size:17px;font-weight:800;color:var(--accent)}
.box-h span{font-size:13px;color:var(--ink-3)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lgrp{display:flex;flex-direction:column;gap:6px;min-width:0}
.lgrp > p{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.lk{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);text-decoration:none;cursor:pointer}
.lk:hover{border-color:var(--blue)}
.lk b{font-size:14.5px;font-weight:800;color:var(--blue);word-break:keep-all}
.lk b small{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--ink-3);margin-right:6px}
.lk span{font-size:12.5px;color:var(--ink-2);line-height:1.45;word-break:keep-all}
.backs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.backs > p{flex:1 1 100%;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.bk{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink-2);cursor:pointer}
.bk:hover{border-color:var(--blue);color:var(--blue)}
.bk.g{border-style:dashed;cursor:default;font-weight:500}
.bk.g:hover{border-color:var(--line);color:var(--ink-2)}
.bk.g em{font-style:normal;font-weight:800;margin-right:6px;color:var(--r3)}
.items{display:flex;flex-direction:column}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:48px;padding:8px 0;border-top:1px solid var(--line)}
.it em{flex:none;font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border:1px solid var(--line-2);border-radius:6px;color:var(--ink-2)}
.it span{flex:1 1 260px;min-width:0;font-size:14.5px;word-break:keep-all}
.it small{flex:none;font-size:12px;color:var(--ink-3)}
.it.wait span{color:var(--ink-3)}

/* 암기 요약 */
.sumbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px}
.sumbar .lbl{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.pbtn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.pbtn:hover{border-color:var(--blue);color:var(--ink)}
.pbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel);font-weight:800}
.sumgrid{display:grid;gap:14px;max-width:820px;margin-top:16px}
.sumcard{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:20px 22px;display:grid;gap:18px;min-width:0}
.sumcard .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.sumcard .lbl small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:8px}
.sumcard .def{font-size:19px;font-weight:700;line-height:1.65;word-break:keep-all}
.sumcard ol{margin:0;padding-left:22px;display:grid;gap:3px;font-size:15.5px}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips span{font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent)}
.kchips.more span{background:var(--paper-2);color:var(--ink-2);border-color:var(--line);font-weight:500}
.kmore{margin-top:10px}
.kmore p{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.mn{font-size:24px;font-weight:900;letter-spacing:.02em;line-height:1.5;color:var(--accent)}
.mnx{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.also > p{font-size:12.5px;font-weight:800;color:var(--ink-3);margin-right:4px}
.also .bk{color:var(--blue)}
.veil{all:unset;cursor:pointer;box-sizing:border-box;width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--line-2);border-radius:10px;background:var(--paper-2);color:var(--ink-2);font-size:13.5px;font-weight:700}
.veil:hover{border-color:var(--blue);color:var(--blue)}
.veil:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.anshead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.anshead .lbl{margin:0;flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;box-sizing:border-box;min-height:36px;display:inline-flex;align-items:center;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);font-weight:800}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

.dg{--c4:var(--r4)}
.sheet .dg{margin:8px 0 6px;padding:12px;border:1.5px dashed #9AA0B8;border-radius:10px;background:transparent}
.sheet .dg-st,.sheet .dg-mod,.sheet .dg-q,.sheet .dg-col,.sheet .dg-ti,.sheet .dg-ly,.sheet .dg-tn,.sheet .dg-vr b,.sheet .dg-vb b,.sheet .dg-its b{background:#FFFFFF}
.sheet .dg-its{border-color:#C9C6B8}
.doc .dg p{margin:0}

/* ===== 대시보드: 토픽 화면(base.css) 밖의 화면들. 색과 글꼴은 base.css 의 토큰만 쓴다 =====
   Layout: 홈은 한 단(수험서 표지 + 과목 책장), 나머지는 왼쪽 차례 + 오른쪽 펼친 쪽의 두 단. */

/* 위쪽 띠 */
.brand{gap:7px;color:var(--ink)}
.brand b{font-weight:900;color:var(--accent);letter-spacing:.01em}
.menu a{color:var(--ink-2);cursor:pointer;font-weight:600}
.menu a:hover{background:var(--paper-2);color:var(--ink)}
.menu a.on,.menu a.on:hover{background:var(--sel);color:var(--on-sel);font-weight:800}
.menu a.soon{color:var(--ink-3)}
.menu a.soon::after{content:'준비 중';margin-left:6px;font-size:10.5px;font-weight:700;padding:0 5px;border:1px solid var(--line-2);border-radius:4px;line-height:1.6}
.menu a.soon.on::after{border-color:currentColor}
a.tbtn{display:inline-flex;align-items:center;text-decoration:none}
a.tbtn.on{border-color:var(--sel);color:var(--accent)}

/* 토픽 찾기 */
.find{position:relative;flex:1 1 200px;max-width:280px;min-width:150px}
.find svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.find input{width:100%;min-height:40px;padding:0 14px 0 36px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.find input::placeholder{color:var(--ink-3)}
.find input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.find-list{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:min(440px,calc(100vw - 32px));max-height:min(70vh,540px);overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 14px 36px var(--shade);padding:6px}
.find-list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;align-items:baseline;padding:9px 12px;border-radius:9px;text-decoration:none}
.find-list a:hover,.find-list a.cur{background:var(--paper-2)}
.find-list b{font-size:14.5px;font-weight:700;word-break:keep-all;color:var(--ink-2)}
.find-list a.open b{color:var(--ink)}
.find-list small{grid-column:1;font-size:12px;color:var(--ink-3)}
.find-list em{grid-row:1 / span 2;grid-column:2;align-self:center;font-style:normal;font-size:11px;font-weight:800;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:0 5px}
.find-list .none{padding:14px;font-size:13.5px;color:var(--ink-3)}

/* 홈 */
.page{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:36px 96px;display:flex;flex-direction:column;gap:56px}
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:28px 44px;align-items:center}
.hero-l{display:flex;flex-direction:column;gap:20px;justify-content:center;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.hero h1{font-size:clamp(30px,4.3vw,46px);font-weight:900;line-height:1.2;letter-spacing:-.025em;text-wrap:balance;word-break:keep-all}
.hero h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:17px;line-height:1.8;color:var(--ink-2);max-width:54ch;word-break:keep-all}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:800;text-decoration:none;border:1px solid var(--line-2);color:var(--ink);background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.btn.pri:hover{color:var(--on-sel);filter:brightness(1.06)}
.btn small{font-size:13px;font-weight:600;opacity:.82}
.nums{display:flex;flex-wrap:wrap;gap:10px 30px;padding-top:4px}
.nums div{display:flex;flex-direction:column;gap:2px}
.nums b{font-family:var(--f-mono);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.nums div.hot b{color:var(--accent)}
.nums span{font-size:12.5px;color:var(--ink-3)}

.term{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:18px;background:var(--card);padding:24px 22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.term::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#FF6B35,#F7C948)}
.term-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px}
.term-h b{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)}
.term-h a{font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
.term-h a:hover{text-decoration:underline}
.dday{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px}
.dday b{font-family:var(--f-mono);font-size:46px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.dday span{font-size:14px;color:var(--ink-2);line-height:1.5;padding-bottom:3px}
.wk{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:9px}
.wk .when{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--blue)}
.wk b{font-size:16.5px;font-weight:800;line-height:1.45;word-break:keep-all}
.wk p{font-size:13.5px;color:var(--ink-3);line-height:1.6}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;min-height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--ink-2);text-decoration:none;background:var(--paper-2)}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.has{border-color:var(--accent);color:var(--accent)}

.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:16px}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec-h p{font-size:14px;color:var(--ink-3)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
.scard{display:flex;flex-direction:column;gap:10px;min-width:0;padding:18px 18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-decoration:none;transition:border-color .15s,transform .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-code{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--on-sel);background:var(--sel);border-radius:7px;padding:2px 9px}
.sc-open{font-size:12.5px;color:var(--ink-3)}
.sc-open b{color:var(--blue);font-family:var(--f-mono)}
.sc-name{font-size:19px;font-weight:800;line-height:1.35;word-break:keep-all}
.sc-meta{font-size:13px;color:var(--ink-2)}
.sc-meta b{font-family:var(--f-mono);font-weight:700;color:var(--ink)}
.rbar{display:flex;gap:2px;height:8px}
.rbar i{display:block;height:100%;min-width:3px;border-radius:2px;background:currentColor}
.sc-week{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rolebox{display:flex;flex-direction:column;gap:6px;padding:14px 16px 15px;border:1px solid var(--line);border-top:4px solid currentColor;border-radius:14px;background:var(--card)}
.rolebox .rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rolebox .rh b{font-size:17px;font-weight:800}
.rolebox .rh span{font-family:var(--f-mono);font-size:13px;font-weight:700}
.rolebox p{font-size:13.5px;line-height:1.6;color:var(--ink-2);word-break:keep-all}
.rolenote{margin-top:12px;font-size:14px;line-height:1.7;color:var(--ink-2);word-break:keep-all}
.rolenote b{color:var(--accent)}

.two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px 40px;align-items:start}
.revs{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.revs a{display:grid;grid-template-columns:92px minmax(0,1fr);gap:2px 14px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.revs a:first-child{border-top:none}
.revs a:hover{background:var(--zebra)}
.revs time{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.revs b{font-size:15px;font-weight:800;color:var(--blue);word-break:keep-all}
.revs b small{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:5px;padding:0 6px}
.revs span{grid-column:2;font-size:13px;color:var(--ink-2);line-height:1.5}
.road{list-style:none;margin:0;padding:4px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.road li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:2px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.road li:first-child{border-top:none}
.road em{font-style:normal;justify-self:start;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3)}
.road li.on em{border-color:var(--r2);color:var(--r2)}
.road b{font-size:15px;font-weight:800}
.road li:not(.on) b{color:var(--ink-2)}
.road span{grid-column:2;font-size:13px;color:var(--ink-3);line-height:1.55;word-break:keep-all}

/* 차례(왼쪽 나무) */
.subj{position:relative;padding:0}
.subj select{appearance:none;-webkit-appearance:none;width:100%;min-height:40px;padding:0 36px 0 12px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;font-weight:800;cursor:pointer}
.subj select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.subj svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.treetop{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.treetop a,.treetop button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.treetop a:hover,.treetop button:hover{border-color:var(--blue);color:var(--blue)}
.treetop a[aria-current="page"],.treetop button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel);font-weight:800}
.treetop :focus-visible{outline:2px solid var(--blue);outline-offset:1px}
a.fam{text-decoration:none;color:var(--ink-2);cursor:pointer}
a.fam:hover{background:var(--paper-2);color:var(--ink)}
a.fam.cur{background:var(--sel);color:var(--on-sel);font-weight:800;box-shadow:none}
a.fam.cur small{color:var(--on-sel)}
.fam .fn{flex:1 1 0;min-width:0;word-break:keep-all;line-height:1.35;padding:6px 0}
.fam small.has{color:var(--blue);font-weight:700}
/* 차례에서 교재가 열린 것과 준비 중인 것: 밝기만으로는 잘 구분되지 않아 점과 굵기를 더했다 (Peter, 10/5) */
.tree .tp.has{color:var(--ink);font-weight:700}
.tp.off{color:var(--ink-3)}
.tp.off span{opacity:.72}
.tdot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 24%,transparent)}
.tp .tdot{margin:0 3px 0 2px}
.tp[aria-current="page"] .tdot{background:var(--on-sel);box-shadow:0 0 0 3px rgba(26,19,0,.16)}
.treefoot .tdot{margin:0 3px 0 2px;vertical-align:1px}
.tp.off[aria-current="page"]{color:var(--on-sel)}
.tree .none{padding:6px 10px 6px 30px;font-size:12.5px;color:var(--ink-3)}
.sub-h{padding:14px 10px 4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)}

/* 쪽 머리(과목 표, 계열 화면, 서브노트) */
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{color:var(--blue);text-decoration:underline}
.vhead .no{display:block;font-family:var(--f-mono);font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
.vsub{margin-top:12px;font-size:16px;line-height:1.75;color:var(--ink-2);max-width:68ch;word-break:keep-all}
.tabrow a.side-link{margin-left:auto;align-self:center;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;padding-bottom:6px}
.tabrow a.side-link:hover{text-decoration:underline}

/* 거르기 띠 */
.fbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--paper);padding:10px 0;margin-top:16px;border-bottom:1px solid var(--line)}
.fbar .lbl{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.fbar .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fbar .seg button{min-height:36px}
.fbar .pbtn{min-height:36px}

/* 과목 전체 표 */
.fgrp{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:52px;padding:10px 16px;background:var(--paper-2);text-decoration:none}
.frow .fno{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--accent)}
.frow b{font-size:16px;font-weight:800;word-break:keep-all}
.frow:hover b{color:var(--blue)}
.fmeta{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3)}
.fmeta b{font-size:12.5px;font-family:var(--f-mono);font-weight:700;color:var(--ink-2)}
.fmeta .op b{color:var(--blue)}
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) 58px 40px 218px;grid-template-areas:"i n r m h";gap:4px 10px;align-items:center;min-height:44px;padding:6px 16px;border-top:1px solid var(--line);text-decoration:none;font-size:14.5px}
.trow.flat{grid-template-columns:30px minmax(0,1fr) 62px 58px 40px 218px;grid-template-areas:"i n f r m h"}
.trow:hover{background:var(--zebra)}
.trow .ti{grid-area:i;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.trow .tn{grid-area:n;font-weight:600;color:var(--ink-3);word-break:keep-all;line-height:1.45}
.trow.open .tn{color:var(--ink);font-weight:700}
.trow.open:hover .tn{color:var(--blue)}
.trow .tf{grid-area:f;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.trow .tr{grid-area:r;justify-self:start}
.trow .tm{grid-area:m;justify-self:start}
.trow .th{grid-area:h;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trow .th b{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--accent);margin-right:7px}
.rtag{font-size:12px;font-weight:800;padding:1px 7px;border:1px solid currentColor;border-radius:6px;white-space:nowrap}
.mtag{font-size:11px;font-weight:800;padding:0 5px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:2px}
.legend{margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.nores{margin-top:20px;padding:22px;border:1px dashed var(--line-2);border-radius:14px;font-size:14.5px;color:var(--ink-2)}

/* 계열 화면 */
.stg{margin-top:26px}
.stg-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-bottom:10px}
.stg-h b{font-size:18px;font-weight:800;color:var(--accent)}
.stg-h span{font-size:14px;color:var(--ink-3)}
.stg-f{margin-top:8px;font-size:13.5px;color:var(--ink-3);line-height:1.6}
.olist{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(150px,236px) minmax(0,1fr) 132px;gap:6px 18px;align-items:start;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none}
.orow:first-child{border-top:none}
.orow:hover{background:var(--zebra)}
.orow .on{display:flex;flex-direction:column;gap:6px;min-width:0}
.orow .on b{font-size:15.5px;font-weight:800;color:var(--ink-3);word-break:keep-all;line-height:1.4}
.orow.open .on b{color:var(--blue)}
.orow .on span{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.orow .od{font-size:14.5px;line-height:1.65;color:var(--ink-2);word-break:keep-all}
.orow .od.wait{color:var(--ink-3);font-size:13.5px}
.orow .oh{font-size:12.5px;color:var(--ink-3);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}
.orow .oh b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--accent)}
.gsec{margin-top:30px;max-width:860px}
.gsec h3{font-size:18.5px;font-weight:800;padding-left:12px;border-left:4px solid var(--sel);margin-bottom:10px}
.gsec > p{font-size:13.5px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qrow p{font-size:15px;line-height:1.6;word-break:keep-all}
.qrow a{font-size:13px;font-weight:800;color:var(--blue);text-decoration:none;white-space:nowrap}
.qrow a:hover{text-decoration:underline}

/* 서브노트 */
.nlist{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.nrow{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr);gap:6px 18px;align-items:start;padding:13px 16px;border-top:1px solid var(--line)}
.nrow:first-child{border-top:none}
.nrow .nn{display:flex;flex-direction:column;gap:6px;min-width:0}
.nrow .nn a,.nrow .nn b{font-size:15.5px;font-weight:800;line-height:1.4;word-break:keep-all;text-decoration:none}
.nrow .nn a{color:var(--blue)}
.nrow .nn a:hover{text-decoration:underline}
.nrow .nn b{color:var(--ink-3)}
.nrow .nn > span{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.nrow .nd{font-size:15.5px;line-height:1.7;word-break:keep-all}
.nrow .nd.wait{font-size:13.5px;color:var(--ink-3)}
.nrow .veil{min-height:44px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.ncard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;min-width:0}
.ncard:hover{border-color:var(--blue)}
.ncard .fno{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--accent)}
.ncard b{font-size:16px;font-weight:800;word-break:keep-all;line-height:1.4}
.ncard span{font-size:12.5px;color:var(--ink-3)}
.ncard span b{font-size:12.5px;font-family:var(--f-mono);color:var(--blue)}
.ncard.off b{color:var(--ink-3)}
.xp .xrow{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 0;border-top:1px solid #D5D8E6}
.xp .xrow b{font-size:14px;font-weight:800;color:#0F766E}
.xp .xrow span{font-size:13.5px;line-height:1.6;color:#141833}

/* 준비 중, 불러오는 중, 일정 */
.empty{margin-top:22px;padding:22px;border:1px dashed var(--line-2);border-radius:14px;display:flex;flex-direction:column;gap:10px;max-width:820px}
.empty b{font-size:17px;font-weight:800}
.empty p{font-size:15px;line-height:1.75;color:var(--ink-2);word-break:keep-all}
.loading{padding:36px 0;font-size:14px;color:var(--ink-3)}
.sibs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.soon-h{display:flex;flex-direction:column;gap:12px;max-width:760px}
.soon-h h1{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.wlist{display:flex;flex-direction:column;gap:10px}
.wrow{display:grid;grid-template-columns:172px minmax(0,1fr);gap:8px 20px;align-items:start;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.wrow.now{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.wrow.past .w-body b{color:var(--ink-2)}
.w-when{display:flex;flex-direction:column;gap:4px}
.w-when b{font-family:var(--f-mono);font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.w-when span{font-size:12.5px;color:var(--ink-3)}
.w-kind{align-self:flex-start;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;border:1px solid var(--r2);color:var(--r2)}
.w-kind.self{border-color:var(--r3);color:var(--r3)}
.w-kind.now{border-color:var(--accent);color:var(--on-sel);background:var(--sel)}
.w-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.w-body b{font-size:16px;font-weight:800;line-height:1.5;word-break:keep-all}
.w-body p{font-size:13px;color:var(--ink-3)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .two-col{grid-template-columns:minmax(0,1fr)}
  .page{padding-block:24px 72px;gap:44px}
  .find{order:5;flex:1 1 100%;max-width:none}
  .find-list{left:0;right:auto}
}
@media (max-width:640px){
  .page{padding-inline:16px}
  .hero h1{font-size:29px}
  .lead{font-size:16px}
  .dday b{font-size:40px}
  .trow,.trow.flat{grid-template-columns:22px auto auto minmax(0,1fr);grid-template-areas:"i n n n" ". r m h";padding:9px 12px;row-gap:5px}
  .trow.flat{grid-template-areas:"i n n n" ". r m h" ". f f f"}
  .trow .th{justify-self:end;text-align:right}
  .frow{padding:10px 12px}
  .fmeta{margin-left:0;flex-basis:100%}
  .orow{grid-template-columns:minmax(0,1fr) auto;padding:12px}
  .orow .od{grid-column:1 / -1;grid-row:2}
  .orow .oh b{display:inline;margin-right:6px}
  .nrow{grid-template-columns:minmax(0,1fr);padding:12px}
  .wrow{grid-template-columns:minmax(0,1fr);padding:14px}
  .revs a{grid-template-columns:minmax(0,1fr)}
  .revs span{grid-column:1}
  .qrow{grid-template-columns:minmax(0,1fr)}
  .soon-h h1{font-size:27px}
  .fbar .cnt{flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){ .scard{transition:none} .scard:hover{transform:none} }

.pager.wide{max-width:none}
@media (max-width:640px){
  .top-in{gap:6px 8px}
  .top-in .grow{display:none}
  .brand{order:1;margin-right:auto}
  .top-in > .tbtn{order:2;min-height:36px;padding:0 11px;font-size:12.5px}
  .menu{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu > *{flex:none;white-space:nowrap;min-height:38px;padding:0 11px}
  .menu a.soon::after{display:none}
  .find{order:4}
}

/* ===== 1차 피드백 (10/4): 로고, 과목 카드 줄, 차례의 계열·토픽 구분과 역할 표시, 푸터와 저작권 ===== */
.brand{gap:9px}
.brand .logo{flex:none;display:block}
.brand span{white-space:nowrap}
.menu .only-m{display:none}

/* 과목 카드 줄 */
.wrap{row-gap:22px}
@media (min-width:901px){ .wrap{grid-template-columns:292px minmax(0,1fr)} }
.subjbar{grid-column:1 / -1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;min-width:0}
.sbc{display:flex;flex-direction:column;gap:5px;min-width:0;padding:10px 12px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none}
.sbc:hover{border-color:var(--blue)}
.sbc.on{border-color:var(--sel);background:var(--accent-bg);box-shadow:inset 0 -3px 0 var(--sel)}
.sb-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sb-top i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--on-sel);background:var(--sel);border-radius:6px;padding:1px 7px}
.sb-top em{font-style:normal;font-size:11px;font-weight:700;color:var(--blue);white-space:nowrap}
.sbc b{font-size:13.5px;font-weight:800;line-height:1.35;word-break:keep-all;color:var(--ink)}
.sbc small{font-size:11.5px;color:var(--ink-3);margin-top:auto}
@media (max-width:1100px){ .subjbar{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* 차례: 계열은 굵게 + 노란 번호, 토픽은 세로줄 아래 들여쓰기 + 역할 표시 */
a.fam{font-size:14px;font-weight:700;color:var(--ink);min-height:40px}
.fam .fn em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--accent);margin-right:7px}
a.fam.cur .fn em{color:var(--on-sel)}
.fam small{font-weight:500}
.tree ul{margin:2px 0 10px 15px;padding-left:5px;border-left:1px solid var(--line-2)}
.tree ul .tp{min-height:34px;padding:0 8px;gap:7px;font-size:13px;font-weight:500}
.tp i.rt{width:38px;padding:0;text-align:center;border-color:transparent;background:color-mix(in srgb,currentColor 15%,transparent)}
.tp.off i.rt{opacity:.6}
.tp[aria-current="page"] i.rt{background:rgba(26,19,0,.14)}
.tree .none{padding-left:10px}

/* 교재와 요약 끝의 저작권 줄 */
.credit,.doc p.credit{margin:24px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;line-height:1.5;color:var(--ink-3);font-weight:400}
.sumgrid .credit{margin-top:2px}

/* 푸터 */
.foot{margin-top:24px;border-top:1px solid var(--line);background:var(--paper-2)}
.foot-in{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:38px 30px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.1fr) minmax(170px,.8fr);gap:30px 48px}
.ft-b{display:flex;align-items:center;gap:12px}
.ft-b .logo{width:40px;height:40px;flex:none}
.ft-b b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.ft-b span{font-size:12.5px;color:var(--ink-3)}
.ft-brand p{margin-top:14px;font-size:13.5px;line-height:1.75;color:var(--ink-2);word-break:keep-all;max-width:30ch}
.ft-h{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);margin-bottom:11px}
.ft-col ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
.ft-col li{display:flex;flex-direction:column;gap:3px;min-width:0}
.ft-col li b{font-size:14px;font-weight:800;color:var(--accent)}
.ft-col li span{font-size:13px;line-height:1.65;color:var(--ink-2);word-break:keep-all}
.ft-m{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.ft-m b{font-size:16.5px;font-weight:800}
.ft-m span{font-size:13px;color:var(--ink-2)}
.ft-links{display:flex;flex-wrap:wrap;gap:6px 14px}
.ft-links a{font-size:13.5px;font-weight:700;color:var(--blue);text-decoration:none}
.ft-links a:hover{text-decoration:underline}
.foot-c{border-top:1px solid var(--line);padding-block:14px;padding-inline:max(20px,calc(50% - 600px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 18px;font-size:12px;color:var(--ink-3)}

@media (max-width:900px){
  .foot-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px 28px}
  .ft-col:nth-child(2){grid-column:1 / -1;grid-row:2}
}
@media (max-width:640px){
  .top-in > .only-d{display:none}
  .menu .only-m{display:inline-flex}
  .brand{font-size:15px;gap:8px;min-width:0}
  .brand .logo{width:26px;height:26px}
  .subjbar{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
  .subjbar::-webkit-scrollbar{display:none}
  .sbc{flex:0 0 136px;scroll-snap-align:start}
  .tree ul .tp{min-height:42px}
  .foot-in{grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:28px 22px}
  .ft-col:nth-child(2){grid-column:auto;grid-row:auto}
  .ft-col ul{grid-template-columns:minmax(0,1fr)}
  .foot-c{padding-inline:16px}
}
@media (max-width:640px){
  .menu{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:20px}
  .menu > *{padding:0 10px}
  .menu .only-m{order:1}
  .menu .soon{order:2}
  .fbar{position:static}
}
@media (min-width:641px) and (max-width:900px){
  .top-in .grow{display:none}
  .find{order:5;flex:1 1 240px;max-width:none}
  .top-in > .tbtn{order:6}
  .menu a.soon::after{display:none}
}

/* ===== 2차 피드백 (10/4): 메인 슬로건, 수치의 뜻 ===== */
.slogan{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.sl{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink-2)}
.sl i{font-style:normal}
.sl .z{color:var(--r1)}
.sl .u{color:var(--r2)}
.slogan span{font-size:14px;color:var(--ink-3)}
.numnote{font-size:13px;line-height:1.7;color:var(--ink-3);max-width:62ch;word-break:keep-all}
.ft-brand p.ft-s{margin-top:16px;display:flex;flex-direction:column;gap:2px;max-width:none}
.ft-s .sl{font-size:17px}
.ft-s span{font-size:13px;color:var(--ink-3)}
.ft-brand p.ft-s + p{margin-top:10px}

/* ===== 3차 피드백 (10/4): 통합교재 소개, 심화반 안내, 수강 문의 ===== */
.tbtn.join{border-color:var(--accent);color:var(--accent)}
.tbtn.join:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
a.tbtn.join.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.menu a.join{color:var(--accent);font-weight:800}
.menu a.join.on,.menu a.join.on:hover{color:var(--on-sel)}
.btn.line{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.line:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn svg{flex:none}
button.btn{font-family:inherit}

/* 통합교재 */
.bookx{display:flex;flex-direction:column;gap:22px;padding:30px 30px 28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,var(--glow),transparent 46%),var(--card)}
.bx-h{display:flex;flex-direction:column;gap:8px;max-width:820px}
.bx-h h2{font-size:clamp(23px,2.7vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1.3;word-break:keep-all}
.bx-h p:last-child{font-size:15.5px;line-height:1.8;color:var(--ink-2);word-break:keep-all}
.zbox{display:flex;flex-direction:column;gap:10px}
.zrow{--zc:var(--r1);display:grid;grid-template-columns:132px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.zrow.up{--zc:var(--r2)}
.zl{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:14px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--zc) 11%,transparent)}
.zl b{font-size:17px;font-weight:900;color:var(--zc);letter-spacing:-.01em}
.zl span{font-size:12.5px;color:var(--ink-2)}
.zsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.zsteps li{position:relative;display:flex;min-width:0}
.zsteps li > svg{position:absolute;left:-9px;top:50%;transform:translateY(-50%);color:var(--zc);z-index:1;background:var(--paper);border-radius:50%}
.zsteps li > div,.zsteps li > a{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding:14px 12px 14px 22px;text-decoration:none;color:inherit}
.zsteps b{font-size:25px;font-weight:800;line-height:1.2;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.zrow.up .zsteps b{font-size:20px;line-height:1.5}
.zsteps em{font-style:normal;font-size:14px;font-weight:800;color:var(--zc)}
.zsteps span{font-size:12.5px;line-height:1.55;color:var(--ink-3);word-break:keep-all}
.zsteps li.go > a{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px var(--accent);border-radius:0 13px 13px 0}
.zsteps li.go em{color:var(--accent)}
.zsteps li.go em::after{content:' 안내 →'}
.zsteps li.go > a:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.bpoints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bpoints > div{display:flex;flex-direction:column;gap:7px;min-width:0;padding:16px 16px 17px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.bpoints i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--on-sel);background:var(--sel);border-radius:6px;width:22px;height:22px;display:grid;place-items:center}
.bpoints b{font-size:15.5px;font-weight:800;line-height:1.45;word-break:keep-all}
.bpoints p{font-size:13.5px;line-height:1.75;color:var(--ink-2);word-break:keep-all}
.bpoints.feat > div{background:var(--card)}

/* 심화반 안내 */
.ab-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 0 2px}
.ab-n div{display:flex;flex-direction:column;gap:2px}
.ab-n b{font-family:var(--f-mono);font-size:34px;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.ab-n span{font-size:12.5px;color:var(--ink-3)}
.ab-p{font-size:13px;line-height:1.75;color:var(--ink-2);word-break:keep-all}
.vs{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:stretch}
.vs-c{display:flex;flex-direction:column;gap:10px;padding:22px 24px 24px;border:1px solid var(--line);border-radius:16px;background:var(--card);min-width:0}
.vs-c.r{border-color:var(--accent);background:var(--accent-bg)}
.vs-t{align-self:flex-start;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.vs-c.r .vs-t{border-color:var(--accent);color:var(--accent)}
.vs-c b{font-size:23px;font-weight:900;letter-spacing:-.02em}
.vs-c ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.vs-c li{position:relative;padding-left:18px;font-size:15px;line-height:1.65;color:var(--ink-2);word-break:keep-all}
.vs-c li::before{content:'';position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.vs-c.r li{color:var(--ink)}
.vs-c.r li::before{background:var(--accent)}
.vs-a{display:grid;place-items:center;color:var(--accent)}
.vs-f{margin-top:16px;font-size:15.5px;font-weight:700;line-height:1.7;color:var(--ink);word-break:keep-all}
.two-col.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.tline li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:1px 14px;padding:13px 16px;border-top:1px solid var(--line)}
.tline li:first-child{border-top:none}
.tline time{grid-row:1 / span 2;font-family:var(--f-mono);font-size:14.5px;font-weight:700;color:var(--r2);font-variant-numeric:tabular-nums;padding-top:2px}
.tline.wk time{font-family:var(--f-body);font-size:13.5px;font-weight:800;color:var(--r1)}
.tline b{font-size:15.5px;font-weight:800;line-height:1.5;word-break:keep-all}
.tline span{font-size:13.5px;line-height:1.65;color:var(--ink-2);word-break:keep-all}

/* 수강 문의 */
.cbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px 40px;align-items:center;padding:28px 30px;border:1px solid var(--accent);border-radius:20px;background:var(--accent-bg)}
.cb-l{display:flex;flex-direction:column;gap:10px;min-width:0}
.cb-l h2{font-size:24px;font-weight:900;letter-spacing:-.02em}
.cb-l p{font-size:15px;line-height:1.75;color:var(--ink-2);word-break:keep-all}
.cb-m{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.cb-m b{font-size:16.5px;font-weight:800;color:var(--ink)}
.cb-m span{font-size:13px;color:var(--ink-2)}
.cb-r{display:flex;flex-direction:column;gap:10px;min-width:0}
.cb-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cb-row > span{flex:none;width:36px;font-size:12px;font-weight:800;color:var(--ink-3)}
.cb-row a{font-size:15.5px;font-weight:800;color:var(--ink);text-decoration:none;word-break:break-all}
.cb-row a:hover{color:var(--blue);text-decoration:underline}
a.cb-mail{font-family:var(--f-mono);letter-spacing:-.01em;color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all;user-select:all;-webkit-user-select:all}
.cb-row a.cb-mail{font-size:16.5px;color:var(--accent)}
.cb-row .pbtn{margin-left:auto;min-height:34px;padding:0 12px;font-size:12.5px;font-family:inherit}
.cb-row small{flex-basis:100%;padding-left:48px;font-size:12.5px;color:var(--ink-3)}
.cb-n{font-size:13px;line-height:1.7;color:var(--ink-2);word-break:keep-all;padding-inline:2px}

/* 홈 아래의 심화반 띠, 교재 끝의 안내 줄 */
.jband{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 36px;align-items:center;padding:26px 30px;border:1px solid var(--accent);border-radius:20px;background:var(--accent-bg)}
.jband > div:first-child{display:flex;flex-direction:column;gap:7px;min-width:0}
.jband h2{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
.jband p{font-size:15px;line-height:1.7;color:var(--ink-2);word-break:keep-all}
.jb-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.jb-r p{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 10px;font-size:14px}
.jb-r .pbtn{min-height:32px;padding:0 11px;font-size:12px;font-family:inherit}

/* ===== 문항집: 주간모의고사 (engine/site/exam.css) =====
   색과 글꼴은 base.css 의 토큰만 쓴다. 시험지(.xs)는 모범답안과 같은 종이라 밝기 전환과 무관하게 같은 색이다. */
