<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>

(function(){
'use strict';
/* ZIP-UP 통합교재 대시보드
   자료: data/book.js (목차 1개) + data/f/{계열}.js (계열마다) + data/t/{토픽ID}.js (토픽마다). 필요한 것만 불러온다.
   주소: #home, #toc.SE, #SE-07, #SE-07.guide, #TP-1038, #TP-1038.sum, #note.SE, #note.SE-07, #note.TP-1038, #slides, #items, #term, #about */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES = ['기본','코어','심화','트렌드','신규'];
const ROLE_DESC = ['계열을 읽기 전에 잡아 둘 바탕 개념', '계열의 중심이 되는 토픽', '코어에서 한 걸음 더 들어간 토픽', '최근의 흐름과 제도', '2027년 출제기준에 새로 들어온 항목'];
const REL = [['pre','먼저 알아야 할 것'],['vs','함께 비교되는 것'],['next','이어서 볼 것'],['out','다른 계열로']];
const VAR_HEAD = ['유형','문항 형태','조립하는 토픽','근거'];
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const chev = d => `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d ? 'M2 4l4 4 4-4' : 'M4 2l4 4-4 4'}"></path></svg>`;
const mq = window.matchMedia('(max-width:900px)');
const downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

/* ---------- 자료 불러오기 ---------- */
const cache = Object.assign({}, window.ZU_PRE || {}), waiting = {}, loading = {};
function settle(key, d){ cache[key] = d; const w = waiting[key]; if (w){ delete waiting[key]; w.forEach(f => f(d)); } }
window.ZU = { book: d => settle('book', d), fam: (no, d) => settle('f/' + no, d), topic: (tid, d) => settle('t/' + tid, d), x: (key, d) => settle('x/' + key, d), q: (key, d) => settle('q/' + key, d) };
function load(key){
  if (cache[key]) return Promise.resolve(cache[key]);
  if (loading[key]) return loading[key];
  const url = 'data/' + key + '.js';
  const viaScript = () => new Promise((res, rej) => {
    (waiting[key] = waiting[key] || []).push(res);
    const s = document.createElement('script'); s.src = url;
    s.onerror = () => { delete waiting[key]; rej(new Error('load ' + key)); };
    document.head.appendChild(s);
  });
  const viaFetch = () => fetch(url).then(r => { if (!r.ok) throw new Error(String(r.status)); return r.text(); }).then(txt => {
    const d = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1)); cache[key] = d; return d; });
  const p = (location.protocol === 'file:' ? viaScript() : viaFetch().catch(viaScript));
  loading[key] = p; p.catch(() => { delete loading[key]; });
  return p;
}

/* ---------- 목차 ---------- */
let B = null; const T = {}, F = {}, S = {};
function shortOf(name){ return name.replace(/\s*\([^)]*\)\s*$/, ''); }
function prep(b){
  B = b;
  B.fams = b.fams.map(a => ({ no: a[0], name: a[1], subj: a[2], sub: a[3], n: a[4], must: a[5], week: a[6], date: a[7], type: a[8], open: a[9], guide: a[10], list: [] }));
  B.fams.forEach(f => { F[f.no] = f; });
  B.topics = b.topics.map(a => ({ tid: a[0], no: a[1], name: a[2], short: a[3] || shortOf(a[2]), role: ROLES[a[4]], rc: 'r' + a[4], must: a[5], hits: a[6], first: a[7], last: a[8], st: a[9] }));
  B.topics.forEach(t => { T[t.tid] = t; const f = F[t.no]; t.i = f.list.length; f.list.push(t); });
  B.order.forEach(c => { S[c] = { code: c, name: b.subjects[c], fams: B.fams.filter(f => f.subj === c) }; });
  B.weeks = b.weeks.map(a => ({ week: a[0], date: a[1], type: a[2], kpc: a[3], theme: a[4], fams: a[5], topics: a[6] }));
  const n = x => Number(x).toLocaleString();
  Object.assign(NUM, { items: n(b.site.exam_items), topics: n(B.topics.length), fams: n(B.fams.length), subjects: n(B.order.length), r0: b.span[0], r1: b.span[1],
    sib: n(B.topics.filter(t => !t.hits).length), new: n(B.topics.filter(t => t.role === '신규').length), term: esc(b.term), round: b.exam.round });
}
/* site.json 의 글에서 {topics} 같은 자리를 통합목차의 수로 바꾼다 */
const NUM = {};
const fill = s => esc(s).replace(/\{(\w+)\}/g, (m, k) => (k in NUM ? NUM[k] : m));

/* ---------- 상태 ---------- */
const st = { route: null, hash: null, token: 0, subj: null, exp: {}, shown: {}, core: false,
  hide: store.get('zu-hide') === '1', deep: store.get('zu-deep') === '1',
  tSort: 'seq', tMust: false, tOpen: false, tRole: -1, fSort: 'stage', nMust: false, nHits: false };

/* ---------- 날짜 ---------- */
const DAY = 86400000;
const ms = s => { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
const todayMs = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
const md = m => { const d = new Date(m); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };
const ymd = s => s.replace(/-/g, '.');
const weekRange = s => md(ms(s) - 6 * DAY) + ' ~ ' + md(ms(s));
function weekState(w, now){ const end = ms(w.date), start = end - 6 * DAY; return now > end ? 'past' : (now >= start ? 'now' : 'next'); }
function currentWeek(){ const now = todayMs(); return B.weeks.find(w => weekState(w, now) === 'now') || B.weeks.find(w => weekState(w, now) === 'next') || null; }

/* ---------- 작은 조각 ---------- */
function hits(t){
  const h = t.hits || 0;
  if (!h) return '기출 없음 · 형제 토픽';
  if (h === 1) return `기출 <b>1회</b> · ${t.last}회`;
  if (h === 2) return `기출 <b>2회</b> · ${t.first}회, ${t.last}회`;
  return `기출 <b>${h}회</b> · 최초 ${t.first}회, 최근 ${t.last}회`;
}
function hitsShort(t){
  const h = t.hits || 0;
  if (!h) return '형제 토픽';
  if (h === 1) return `<b>1회</b>${t.last}회`;
  if (h === 2) return `<b>2회</b>${t.first}회, ${t.last}회`;
  return `<b>${h}회</b>최초 ${t.first} · 최근 ${t.last}`;
}
const tags = t => `<span class="rtag ${t.rc}">${esc(t.role)}</span>${t.must ? '<span class="mtag">필수</span>' : ''}`;
const famWhen = f => f.date ? `${B.term} ${f.type === '자습' ? '자습' : '강의'} ${md(ms(f.date))}` : '';
function metaRow(t, d){
  let h = `<span class="chip role ${t.rc}">${esc(t.role)}</span>`;
  if (t.must) h += '<span class="chip must">필수</span>';
  h += `<span class="chip">${hits(t)}</span>`;
  if (d && d.stage) h += `<span class="chip">${esc(d.stage)}</span>`;
  if (d && d.rev) h += `<span class="chip rev">개정 ${d.rev.n} · ${esc(ymd(d.rev.date))}</span>`;
  if (d && d.fresh){   // 최신성 토픽(법령, 가이드, 표준, 동향)에만 붙는다: 근거를 확인한 날과 검수 여부
    if (d.fresh.asof) h += `<span class="chip asof">기준일 ${esc(ymd(d.fresh.asof))}</span>`;
    h += d.fresh.rv ? `<span class="chip rvd">검수 완료 ${esc(ymd(d.fresh.rv))}</span>` : '<span class="chip rvw">검수 전</span>';
  }
  h += `<span class="chip id">${esc(t.tid)}</span>`;
  return h;
}
function refBox(d){
  const f = d.fresh; if (!f || !f.refs || !f.refs.length) return '';
  return `<div class="refbox"><div class="box-h"><b>근거 문서</b><span>${f.asof ? `${esc(ymd(f.asof))}에 확인한 판입니다. ` : ''}법령과 표준은 개정될 수 있으니 기준일 뒤의 변경은 출처에서 확인하세요</span></div><ul>`
    + f.refs.map(r => `<li><b>${esc(r.t)}</b><span>${esc(r.ver)}</span>${/^https?:/.test(r.url || '') ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">출처 열기</a>` : ''}</li>`).join('') + '</ul></div>';
}
const noteFilter = t => (!st.nMust || t.must) && (!st.nHits || t.hits);

/* ---------- 차례 ---------- */
function renderTree(){
  if (st.route.mode === 'items'){ xTree(); return; }
  const r = st.route, note = r.mode === 'note', s = S[st.subj];
  let h = `<label class="subj"><select id="subjsel" aria-label="과목 고르기">${B.order.map(c => `<option value="${c}"${c === s.code ? ' selected' : ''}>${esc(c)} ${esc(S[c].name)}</option>`).join('')}</select>${chev(true)}</label>`;
  h += `<div class="treetop"><a href="#${note ? 'note' : 'toc'}.${s.code}"${(r.v === 'toc' || r.v === 'note') ? ' aria-current="page"' : ''}>${note ? '계열 목록' : '과목 전체 표'}</a>`;
  if (note) h += `<button type="button" data-nf="nMust" aria-pressed="${st.nMust}">필수만</button><button type="button" data-nf="nHits" aria-pressed="${st.nHits}">기출 있는 것만</button>`;
  h += '</div><ul class="tree">';
  let lastSub = null;
  s.fams.forEach(f => {
    if (f.sub && f.sub !== lastSub){ h += `<li class="sub-h">${esc(f.sub)}</li>`; lastSub = f.sub; }
    const here = r.no === f.no, cur = here && (r.v === 'fam' || r.v === 'notefam'), exp = !!st.exp[f.no];
    h += `<li><a class="fam${cur ? ' cur' : (here ? ' open' : '')}" href="#${note ? 'note.' : ''}${f.no}" data-famrow="${f.no}" aria-expanded="${exp}">${chev(exp)}<span class="fn"><em>${esc(f.no)}</em>${esc(f.name)}</span><small${f.open ? ' class="has"' : ''}>${f.open ? f.open + '/' : ''}${f.n}</small></a>`;
    if (exp){
      const list = note ? f.list.filter(noteFilter) : f.list;
      h += '<ul>' + (list.length ? list.map(t => `<li><a class="tp${t.st ? ' has' : ' off'}" href="#${note ? 'note.' : ''}${t.tid}"${t.tid === r.tid ? ' aria-current="page"' : ''}><i class="rt ${t.rc}">${esc(t.role)}</i><span>${esc(t.short)}</span>${t.must ? '<i class="must">필수</i>' : ''}${t.st ? '<b class="tdot" title="교재가 열린 토픽"></b>' : ''}</a></li>`).join('') : '<li class="none">거르기에 맞는 토픽이 없습니다</li>') + '</ul>';
    }
    h += '</li>';
  });
  h += `</ul><p class="treefoot">숫자는 교재 공개 수 / 토픽 수입니다. <b class="tdot"></b> 점이 붙고 이름이 밝은 토픽은 교재가 열린 토픽이고, 흐린 이름은 준비하고 있는 토픽입니다. 이름 앞의 표시는 회독 순서(기본, 코어, 심화, 트렌드, 신규)입니다.</p>`;
  $('#tree').innerHTML = h;
  const f = r.no ? F[r.no] : null, t = r.tid ? T[r.tid] : null;
  $('#sidesum').innerHTML = `${chev(false)}<span>${note ? '서브노트' : '목차'} · ${f ? esc(f.no) + ' ' + esc(f.name) + (t ? ' › ' + esc(t.short) : '') : esc(s.code) + ' ' + esc(s.name)}</span>`;
}

/* ---------- 과목 카드 줄 (통합목차와 서브노트의 맨 위) ---------- */
function renderSubjBar(){
  $('#subjbar').classList.toggle('xkinds', st.route.mode === 'items');
  if (st.route.mode === 'items'){ xBar(); return; }
  const r = st.route, bar = $('#subjbar'), show = r.v === 'toc' || r.v === 'note';
  bar.hidden = !show; if (!show){ bar.innerHTML = ''; return; }
  const pre = r.mode === 'note' ? 'note.' : 'toc.';
  bar.innerHTML = B.order.map(c => {
    const s = S[c], n = s.fams.reduce((a, f) => a + f.n, 0), op = s.fams.reduce((a, f) => a + f.open, 0), on = c === st.subj;
    return `<a class="sbc${on ? ' on' : ''}" href="#${pre}${c}"${on ? ' aria-current="page"' : ''}><span class="sb-top"><i>${esc(c)}</i>${op ? `<em>${r.mode === 'note' ? '요약' : '교재'} ${op}</em>` : ''}</span><b>${esc(s.name)}</b><small>${s.fams.length}계열 · ${n}토픽</small></a>`;
  }).join('');
  const cur = bar.querySelector('.on');
  if (cur && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = Math.max(0, cur.offsetLeft - (bar.clientWidth - cur.offsetWidth) / 2);
}

/* ---------- 통합목차: 과목 전체 표 ---------- */
function tocView(r){
  const s = S[r.subj], all = s.fams.reduce((a, f) => a.concat(f.list), []);
  const pass = t => (!st.tMust || t.must) && (!st.tOpen || t.st) && (st.tRole < 0 || t.role === ROLES[st.tRole]);
  const shown = all.filter(pass);
  const seg = (attr, cur, items) => `<div class="seg" role="group">${items.map(x => `<button type="button" ${attr}="${x[0]}" aria-pressed="${String(cur) === String(x[0])}">${x[1]}</button>`).join('')}</div>`;
  let h = `<div class="crumb"><span>통합목차</span></div><h1 class="vhead"><span class="no">${esc(s.code)}</span>${esc(s.name)}</h1>`;
  h += `<div class="tmeta"><span class="chip">계열 <b>${s.fams.length}</b></span><span class="chip">토픽 <b>${all.length}</b></span><span class="chip">필수 <b>${all.filter(t => t.must).length}</b></span><span class="chip">교재 공개 <b>${all.filter(t => t.st).length}</b></span></div>`;
  h += `<div class="fbar"><span class="lbl">순서</span>${seg('data-ts', st.tSort, [['seq','학습 순'],['hits','자주 나온 순']])}`
    + `<span class="lbl">거르기</span><button class="pbtn" type="button" data-tf="tMust" aria-pressed="${st.tMust}">필수만</button><button class="pbtn" type="button" data-tf="tOpen" aria-pressed="${st.tOpen}">교재 공개만</button>`
    + seg('data-tr', st.tRole, [[-1,'전체']].concat(ROLES.map((x, i) => [i, x])))
    + `<span class="cnt">${all.length}토픽 중 ${shown.length}</span></div>`;
  const trow = (t, i, flat) => `<a class="trow${flat ? ' flat' : ''}${t.st ? ' open' : ''}" href="#${t.tid}"><span class="ti">${i}</span><span class="tn">${t.st ? '<i class="dot"></i>' : ''}${esc(t.name)}</span>${flat ? `<span class="tf">${esc(t.no)}</span>` : ''}<span class="tr"><span class="rtag ${t.rc}">${esc(t.role)}</span></span><span class="tm">${t.must ? '<span class="mtag">필수</span>' : ''}</span><span class="th">${hitsShort(t)}</span></a>`;
  if (!shown.length) h += '<p class="nores">거르기에 맞는 토픽이 없습니다. 거르기를 하나 풀어 보세요.</p>';
  else if (st.tSort === 'hits'){
    const list = shown.slice().sort((a, b) => (b.hits - a.hits) || (b.last - a.last));
    h += '<div class="fgrp">' + list.map((t, i) => trow(t, i + 1, true)).join('') + '</div>';
  } else {
    s.fams.forEach(f => {
      const list = f.list.filter(pass); if (!list.length) return;
      h += `<section class="fgrp"><a class="frow" href="#${f.no}"><span class="fno">${esc(f.no)}</span><b>${esc(f.name)}</b><span class="fmeta">${f.date ? `<span>${esc(famWhen(f))}</span>` : ''}<span>토픽 <b>${f.n}</b></span><span>필수 <b>${f.must}</b></span>${f.open ? `<span class="op">교재 <b>${f.open}</b></span>` : ''}</span></a>`
        + list.map(t => trow(t, t.i + 1, false)).join('') + '</section>';
    });
  }
  h += '<p class="legend"><i class="dot"></i>교재가 공개된 토픽입니다. 기출 표기는 횟수와 최초·최근 회차입니다. 기출이 없는 토픽은 같은 계열의 형제 토픽입니다.</p>';
  $('#view').innerHTML = h;
}

/* ---------- 통합목차: 계열 화면 ---------- */
function famPager(f, note){
  const fs = S[f.subj].fams, i = fs.indexOf(f), p = fs[i - 1], n = fs[i + 1], pre = note ? '#note.' : '#';
  return `<nav class="pager wide" aria-label="계열 이동">${p ? `<a href="${pre}${p.no}"><small>← 이전 계열</small><span>${esc(p.no)} ${esc(p.name)}</span></a>` : ''}${n ? `<a class="nx" href="${pre}${n.no}"><small>다음 계열 →</small><span>${esc(n.no)} ${esc(n.name)}</span></a>` : ''}</nav>`;
}
function famView(r){
  const f = F[r.no], s = S[f.subj], tab = r.tab === 'guide' ? 'guide' : 'list';
  let h = `<div class="crumb"><a href="#toc.${s.code}">${esc(s.code)} ${esc(s.name)}</a><span>›</span><span>${esc(f.no)} ${esc(f.name)}</span></div>`;
  h += `<h1 class="vhead"><span class="no">${esc(f.no)}</span>${esc(f.name)}</h1><div id="famsub"></div>`;
  h += `<div class="tmeta">${f.date ? `<span class="chip">${esc(famWhen(f))}</span>` : ''}<span class="chip">토픽 <b>${f.n}</b></span><span class="chip">필수 <b>${f.must}</b></span><span class="chip">기출 있는 토픽 <b>${f.list.filter(t => t.hits).length}</b></span><span class="chip">교재 공개 <b>${f.open}</b> / ${f.n}</span></div>`;
  h += `<div class="tabrow" role="tablist"><a class="tab" role="tab" href="#${f.no}" aria-selected="${tab === 'list'}">토픽 한눈에 보기</a><a class="tab" role="tab" href="#${f.no}.guide" aria-selected="${tab === 'guide'}">계열 가이드</a><a class="side-link" href="#note.${f.no}">서브노트에서 이 계열 보기 →</a></div>`;
  h += '<div id="fambody"><p class="loading">계열 정보를 불러오는 중입니다</p></div>' + famPager(f, false);
  $('#view').innerHTML = h;
  const tk = st.token, done = fd => { if (tk === st.token) paintFam(f, fd, tab); };
  ((f.open || f.guide) ? load('f/' + f.no) : Promise.resolve(null)).then(done).catch(() => done(null));
}
function paintFam(f, fd, tab){
  if (fd && (fd.sub || fd.lead)) $('#famsub').innerHTML = `<p class="vsub">${fd.sub ? '<b>' + esc(fd.sub) + '.</b> ' : ''}${esc(fd.lead || '')}</p>`;
  const defs = (fd && fd.defs) || {};
  let h = '';
  if (tab === 'guide'){
    if (fd && (fd.compare || fd.variants || fd.bridges)){
      if (fd.compare) h += `<section class="gsec"><h3>${esc(fd.compare.title)}</h3><div class="tw"><table><thead><tr>${fd.compare.head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${fd.compare.rows.map(row => '<tr>' + row.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('')}</tbody></table></div></section>`;
      if (fd.variants) h += `<section class="gsec"><h3>변형 예측</h3><div class="tw"><table><thead><tr>${VAR_HEAD.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${fd.variants.map(row => '<tr>' + row.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('')}</tbody></table></div><p>근거가 "예상"인 문항은 기출이 아니라 계열 구조에서 나온 변형입니다.</p></section>`;
      if (fd.bridges) h += `<section class="gsec"><h3>연결 질문</h3><div class="qlist">${fd.bridges.map(b => `<div class="qrow"><p>${esc(b[0])}</p><a href="#${esc(b[1])}">${esc(b[2])} →</a></div>`).join('')}</div></section>`;
      h += '<section class="gsec"><p>계열 가이드는 넓히는 중입니다. 핵심 비교를 여러 개로 늘리고, 변형마다 답안의 방향을, 연결 질문마다 짧은 답을 붙일 예정입니다.</p></section>';
    } else h += '<div class="empty"><b>이 계열의 가이드는 준비 중입니다</b><p>계열 안에서 자주 묻는 비교, 기출에서 예상되는 변형, 다른 계열로 이어지는 질문을 정리해 올립니다. 그때까지는 토픽 한눈에 보기에서 토픽을 골라 읽으면 됩니다.</p></div>';
  } else {
    const stages = fd && fd.stages;
    const orow = t => `<a class="orow${t.st ? ' open' : ''}" href="#${t.tid}"><div class="on"><b>${esc(t.name)}</b><span>${tags(t)}</span></div>${defs[t.tid] ? `<p class="od">${esc(defs[t.tid])}</p>` : '<p class="od wait">교재 준비 중</p>'}<div class="oh">${t.hits ? `<b>${t.hits}회</b>${t.hits === 1 ? t.last + '회' : (t.hits === 2 ? t.first + '회, ' + t.last + '회' : '최초 ' + t.first + ' · 최근 ' + t.last)}` : '형제 토픽'}</div></a>`;
    const sort = (stages || st.fSort === 'hits') ? st.fSort : 'stage';
    h += `<div class="fbar"><span class="lbl">순서</span><div class="seg" role="group"><button type="button" data-fs="stage" aria-pressed="${sort !== 'hits'}">${stages ? '단계 순' : '학습 순'}</button><button type="button" data-fs="hits" aria-pressed="${sort === 'hits'}">자주 나온 순</button></div><span class="cnt">한 줄 정의는 교재가 공개된 토픽만 보입니다</span></div>`;
    if (sort === 'hits') h += '<div class="stg"><div class="olist">' + f.list.slice().sort((a, b) => (b.hits - a.hits) || (b.last - a.last)).map(orow).join('') + '</div></div>';
    else if (stages) stages.forEach(sg => { h += `<section class="stg"><div class="stg-h"><b>${esc(sg[0])}</b><span>${esc(sg[1])}</span></div><div class="olist">${sg[2].map(id => orow(T[id])).join('')}</div>${sg[3] ? `<p class="stg-f">${esc(sg[3])}</p>` : ''}</section>`; });
    else h += '<div class="stg"><div class="olist">' + f.list.map(orow).join('') + '</div></div>';
  }
  $('#fambody').innerHTML = h;
}

/* ---------- 통합목차: 토픽 화면 ---------- */
function topicHead(t, d){
  const f = F[t.no], s = S[f.subj];
  return `<div class="crumb"><a href="#toc.${s.code}">${esc(s.code)} ${esc(s.name)}</a><span>›</span><a href="#${f.no}">${esc(f.no)} ${esc(f.name)}</a><span>›</span><span>${esc(t.short)} (${t.i + 1} / ${f.list.length})</span></div>`
    + `<h1 class="vhead">${esc(t.name)}</h1><div class="tmeta">${metaRow(t, d)}</div>`;
}
function topicPager(t, note){
  const list = F[t.no].list, prev = list[t.i - 1], next = list[t.i + 1], pre = note ? '#note.' : '#';
  return `<nav class="pager" aria-label="토픽 이동">${prev ? `<a href="${pre}${prev.tid}"><small>← 이전 토픽</small><span>${esc(prev.short)}</span></a>` : ''}${next ? `<a class="nx" href="${pre}${next.tid}"><small>다음 토픽 →</small><span>${esc(next.short)}</span></a>` : ''}</nav>`;
}
function waitBox(t, note){
  const f = F[t.no], sib = f.list.filter(x => x.st && x !== t);
  return `<div class="empty"><b>${note ? '이 토픽의 요약은 준비 중입니다' : '이 토픽의 교재는 준비 중입니다'}</b><p>교재는 계열 순서대로 올리고 있습니다. 공개되면 이 자리에 교재와 암기 요약, 모범답안이 함께 열립니다.</p>`
    + (sib.length ? `<p>같은 계열에서 먼저 볼 수 있는 토픽</p><div class="sibs">${sib.map(x => `<a class="bk" href="#${note ? 'note.' : ''}${x.tid}">${esc(x.short)}</a>`).join('')}</div>` : `<p><a class="xref" href="#${f.no}">${esc(f.no)} ${esc(f.name)}</a> 계열의 토픽 목록에서 기출 횟수와 순서를 먼저 볼 수 있습니다.</p>`) + '</div>';
}
function linkBox(t, d){
  if (!d.links) return '';
  let h = '<div class="box"><div class="box-h"><b>연결</b><span>누르면 한 줄 정의를 먼저 보여 주고 이동합니다.</span></div><div class="lgrid">';
  REL.forEach(([k, label]) => {
    const ls = d.links.filter(l => l.rel === k); if (!ls.length) return;
    h += `<div class="lgrp"><p>${label}</p>` + ls.map(l => { const x = T[l.to]; if (!x) return '';
      return `<a class="lk" href="#${x.tid}" data-ref="${x.tid}"><b>${k === 'out' ? `<small>${esc(x.no)}</small>` : ''}${esc(x.short)}</b><span>${esc(l.why)}</span></a>`; }).join('') + '</div>';
  });
  h += '</div>';
  if ((d.back && d.back.length) || (d.guide && d.guide.length)){
    h += '<div class="backs"><p>이 토픽을 가리키는 곳</p>'
      + (d.back || []).map(id => { const x = T[id]; return x ? `<a class="bk" href="#${x.tid}" data-ref="${x.tid}">${esc(x.short)}</a>` : ''; }).join('')
      + (d.guide || []).map(g => `<span class="bk g"><em>${esc(g.k)}</em>${esc(g.t)}</span>`).join('') + '</div>';
  }
  return h + '</div>';
}
function itemBox(d, t){
  const xq = xItemsOf(t.tid);
  if (!d.items && !xq) return '';
  return `<div class="box"><div class="box-h"><b>이 토픽의 문항</b><span>${xq ? '문항집에서 이 토픽을 가리키는 문항입니다. 누르면 문항 화면이 열립니다.' : '문항집이 열리면 이 토픽을 가리키는 문항이 여기에 모입니다.'}</span></div><div class="items">` + xq
    + (d.items || []).map(x => `<div class="it${x.wait ? ' wait' : ''}"><em>${esc(x.k)}</em><span>${esc(x.q)}</span><small>${esc(x.src || '')}</small></div>`).join('') + '</div></div>';
}
function sumCard(t, d, forImage, note){
  const X = d.sum, hide = st.hide && !forImage, sh = st.shown;
  const k = X.mn.indexOf(' ('), mnA = k > 0 ? X.mn.slice(0, k) : X.mn, mnB = k > 0 ? X.mn.slice(k + 1) : '';
  const nk = X.keys.length + (X.keys2 || []).length;
  let h = '<div class="sumcard">';
  h += `<div><p class="lbl">한 줄 정의</p>${hide && !sh.def ? '<button class="veil" type="button" data-veil="def">한 줄 정의 가려짐 · 눌러서 보기</button>' : `<p class="def">${esc(X.def)}</p>`}</div>`;
  h += `<div><p class="lbl">${X.one ? '필수 키워드<small>모범답안에 반드시 나오는 말</small>' : '키워드'}</p>`;
  if (hide && !sh.keys) h += `<button class="veil" type="button" data-veil="keys">키워드 ${nk}개 가려짐 · 눌러서 보기</button>`;
  else {
    h += `<div class="kchips">${X.keys.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
    if (X.keys2 && X.keys2.length) h += `<div class="kmore"><p>그 밖의 키워드</p><div class="kchips more">${X.keys2.map(x => `<span>${esc(x)}</span>`).join('')}</div></div>`;
  }
  h += '</div>';
  h += `<div class="two"><div><p class="lbl">답안 목차${X.one ? '<small>모범답안의 단락 제목과 같음</small>' : ''}</p><ol>${X.outline.map(o => `<li>${esc(o)}</li>`).join('')}</ol></div>`;
  if (X.mn) h += `<div><p class="lbl">두문자</p><p class="mn">${esc(mnA)}</p>${mnB ? `<p class="mnx">${esc(mnB)}</p>` : ''}</div>`;
  h += '</div>';
  if (!forImage && d.links){
    const order = ['vs', 'next', 'pre', 'out'];
    const ls = d.links.slice().sort((a, b) => order.indexOf(a.rel) - order.indexOf(b.rel)).slice(0, 4);
    h += '<div class="also"><p>함께 보기</p>' + ls.map(l => { const x = T[l.to]; if (!x) return '';
      return (note && x.st) ? `<a class="bk" href="#note.${x.tid}">${esc(x.short)}</a>` : `<a class="bk" href="#${x.tid}" data-ref="${x.tid}">${esc(x.short)}</a>`; }).join('') + '</div>';
  }
  return h + '</div>';
}
function ansCard(d){
  const X = d.sum, two = X.n && X.n[1] > X.n[0];
  let h = '<div class="sumcard"><div>';
  h += `<div class="anshead"><p class="lbl">모범답안 · ${esc(X.kind)}</p>`;
  if (two) h += `<div class="seg" role="group" aria-label="모범답안 분량"><button type="button" data-core="0" aria-pressed="${!st.core}">전체 ${X.n[1]}줄</button><button type="button" data-core="1" aria-pressed="${st.core}">1페이지 분량 ${X.n[0]}줄</button></div>`;
  h += `</div><div class="answrap${st.core ? ' core' : ''}">${X.ans}</div>`;
  h += two
    ? '<p class="anote">밑줄 친 말이 필수 키워드, 형광 표시한 줄이 차별화 포인트입니다. "보충" 표시는 이해를 돕는 내용이라 시험장에서는 쓰지 않아도 됩니다. 1페이지 분량을 누르면 꼭 쓸 줄만 남습니다.</p>'
    : '<p class="anote">답안지에 그대로 옮겨 쓰는 형식입니다. 2번의 그림이 손으로 그릴 도식이고, 형광 표시한 줄이 차별화 포인트입니다.</p>';
  return h + '</div></div>';
}
function diffCard(d){
  const X = d.sum;
  return (X.diff && X.diff.length) ? `<div class="sumcard"><div><p class="lbl">차별화 포인트 · 답안에 이렇게 씁니다</p><ul class="dfl">${X.diff.map(x => `<li><em>${esc(x.at)}</em><span><mark>${esc(x.text)}</mark></span></li>`).join('')}</ul></div></div>` : '';
}
function topicView(r){
  const t = T[r.tid];
  if (!t.st){ $('#view').innerHTML = topicHead(t, null) + waitBox(t, false) + topicPager(t, false); return; }
  store.set('zu-last', t.tid);
  const d = cache['t/' + t.tid];
  if (d){ paintTopic(t, d, r.tab); return; }
  $('#view').innerHTML = topicHead(t, null) + '<p class="loading">교재를 불러오는 중입니다</p>';
  const tk = st.token;
  load('t/' + t.tid).then(doc => { if (tk === st.token){ paintTopic(t, doc, r.tab); spy(); } })
    .catch(() => { if (tk === st.token) $('#view').innerHTML = topicHead(t, null) + '<div class="empty"><b>교재를 불러오지 못했습니다</b><p>인터넷 연결을 확인하고 다시 열어 주세요.</p></div>'; });
}
function paintTopic(t, d, tab){
  const list = F[t.no].list, prev = list[t.i - 1], next = list[t.i + 1];
  let h = topicHead(t, d);
  if (d.legacy) h += `<p class="legacy">이전 형식(${esc(d.legacy)})의 교재입니다. 새 형식(7절 구성, 연결, 모범답안의 보충 표시)으로 옮기는 중입니다.</p>`;
  h += `<div class="tabrow" role="tablist"><button class="tab" role="tab" type="button" data-tab="doc" aria-selected="${tab === 'doc'}">교재</button><button class="tab" role="tab" type="button" data-tab="sum" aria-selected="${tab === 'sum'}">암기 요약</button>`
    + `<div class="mini">${prev ? `<a href="#${prev.tid}">이전: ${esc(prev.short)}</a>` : ''}${next ? `<a href="#${next.tid}">다음: ${esc(next.short)}</a>` : ''}</div></div>`;
  if (tab === 'doc'){
    h += `<nav class="toc" aria-label="이 교재의 절">${d.secs.map((s, k) => `<button type="button" data-sec="s${k}">${s.n ? s.n + '. ' : ''}${esc(s.h)}</button>`).join('')}</nav>`;
    h += '<div class="doc">' + d.secs.map((s, k) => `<section id="s${k}"><h2>${s.n ? `<i>${s.n}</i>` : ''}<span>${esc(s.h)}</span></h2>${s.html}`
      + (s.h.indexOf('계열 속 위치') >= 0 ? linkBox(t, d) : '') + (s.h.indexOf('시험 출제 관점') >= 0 ? itemBox(d, t) : '') + '</section>').join('')
      + refBox(d) + `<p class="docmeta"><span>본문 약 ${d.chars.toLocaleString()}자</span><span>도식 ${d.dg}개</span><span>표 ${d.tb}개</span><span>강조 상자 ${d.co}개</span></p>${joinLine()}<p class="credit">${esc(B.site.credit)}</p></div>`;
  } else {
    h += `<div class="sumbar"><span class="lbl">외우기</span><button class="pbtn" type="button" data-hide="1" aria-pressed="${st.hide}">가리고 떠올리기 ${st.hide ? '끄기' : '켜기'}</button><span class="grow"></span><span class="lbl">이미지로 저장</span><button class="pbtn" type="button" data-img="sum">요약 카드</button><button class="pbtn" type="button" data-img="ans">모범답안</button></div>`;
    h += '<div class="sumgrid">' + sumCard(t, d, false, false);
    if (st.hide && !st.shown.ans) h += '<button class="veil" type="button" data-veil="ans">모범답안과 차별화 포인트 가려짐 · 눌러서 보기</button>';
    else h += ansCard(d) + diffCard(d);
    h += `${joinLine()}<p class="credit">${esc(B.site.credit)}</p></div>`;
  }
  $('#view').innerHTML = h + topicPager(t, false);
}

/* ---------- 서브노트 ---------- */
function noteView(r){
  const s = S[r.subj], all = s.fams.reduce((a, f) => a.concat(f.list), []);

  h += '<p class="vsub">교재의 암기 요약만 모아 빠르게 돌려 보는 곳입니다. 계열을 누르면 한 줄 정의 목록이, 토픽을 누르면 요약 한 장이 열립니다.</p>';
  h += `<div class="tmeta"><span class="chip">계열 <b>${s.fams.length}</b></span><span class="chip">요약 공개 <b>${all.filter(t => t.st).length}</b> / ${all.length}</span></div>`;
  h += '<div class="ngrid">' + s.fams.map(f => `<a class="ncard${f.open ? '' : ' off'}" href="#note.${f.no}"><span class="fno">${esc(f.no)}</span><b>${esc(f.name)}</b><span>${f.open ? `요약 <b>${f.open}</b> / ${f.n}` : `토픽 ${f.n} · 준비 중`}</span></a>`).join('') + '</div>';

function noteFamView(r){
  const f = F[r.no], s = S[f.subj];
  let h = `<div class="crumb"><a href="#note.${s.code}">서브노트 · ${esc(s.code)} ${esc(s.name)}</a><span>›</span><span>${esc(f.no)} ${esc(f.name)}</span></div>`;
  h += `<h1 class="vhead"><span class="no">${esc(f.no)}</span>${esc(f.name)}</h1>`;
  h += `<div class="tmeta"><span class="chip">토픽 <b>${f.n}</b></span><span class="chip">필수 <b>${f.must}</b></span><span class="chip">요약 공개 <b>${f.open}</b> / ${f.n}</span><a class="chip" href="#${f.no}" style="text-decoration:none">계열 화면 열기 →</a></div>`;
  h += `<div class="sumbar"><span class="lbl">외우기</span><button class="pbtn" type="button" data-hide="1" aria-pressed="${st.hide}">가리고 떠올리기 ${st.hide ? '끄기' : '켜기'}</button><span class="lbl">거르기</span><button class="pbtn" type="button" data-nf="nMust" aria-pressed="${st.nMust}">필수만</button><button class="pbtn" type="button" data-nf="nHits" aria-pressed="${st.nHits}">기출 있는 것만</button><span class="grow"></span>${f.open ? '<span class="lbl">이미지로 저장</span><button class="pbtn" type="button" data-img="fam">이 계열 한 장</button>' : ''}</div>`;
  h += '<div id="notebody"><p class="loading">한 줄 정의를 불러오는 중입니다</p></div>' + famPager(f, true);
  $('#view').innerHTML = h;
  const tk = st.token, done = fd => { if (tk !== st.token) return;
    const defs = (fd && fd.defs) || {}, list = f.list.filter(noteFilter);
    $('#notebody').innerHTML = list.length ? '<div class="nlist">' + list.map(t => {
      const def = defs[t.tid];
      return `<div class="nrow"><div class="nn">${t.st ? `<a href="#note.${t.tid}">${esc(t.short)}</a>` : `<b>${esc(t.short)}</b>`}<span>${tags(t)}${t.hits ? '기출 ' + t.hits + '회' : ''}</span></div>`
        + (def ? ((st.hide && !st.shown[t.tid]) ? `<button class="veil" type="button" data-veil="${t.tid}">정의 가려짐 · 눌러서 보기</button>` : `<p class="nd">${esc(def)}</p>`) : '<p class="nd wait">교재 준비 중</p>') + '</div>';
    }).join('') + '</div>' : '<p class="nores">거르기에 맞는 토픽이 없습니다. 거르기를 하나 풀어 보세요.</p>';
  };
  (f.open ? load('f/' + f.no) : Promise.resolve(null)).then(done).catch(() => done(null));
}
function noteTopicView(r){
  const t = T[r.tid], f = F[t.no], s = S[f.subj];
  const head = d => `<div class="crumb"><a href="#note.${s.code}">서브노트 · ${esc(s.code)}</a><span>›</span><a href="#note.${f.no}">${esc(f.no)} ${esc(f.name)}</a><span>›</span><span>${esc(t.short)} (${t.i + 1} / ${f.list.length})</span></div><h1 class="vhead">${esc(t.name)}</h1><div class="tmeta">${metaRow(t, d)}</div>`;
  if (!t.st){ $('#view').innerHTML = head(null) + waitBox(t, true) + topicPager(t, true); return; }
  const paint = d => {
    let h = head(d);
    h += `<div class="sumbar"><span class="lbl">외우기</span><button class="pbtn" type="button" data-hide="1" aria-pressed="${st.hide}">가리고 떠올리기 ${st.hide ? '끄기' : '켜기'}</button><span class="lbl">보는 깊이</span><div class="seg" role="group"><button type="button" data-deep="0" aria-pressed="${!st.deep}">요약</button><button type="button" data-deep="1" aria-pressed="${st.deep}">모범답안까지</button></div><span class="grow"></span><span class="lbl">이미지로 저장</span><button class="pbtn" type="button" data-img="sum">요약 카드</button>${st.deep ? '<button class="pbtn" type="button" data-img="ans">모범답안</button>' : ''}<a class="pbtn" href="#${t.tid}" style="display:inline-flex;align-items:center;text-decoration:none">교재 열기</a></div>`;
    h += '<div class="sumgrid">' + sumCard(t, d, false, true);
    if (st.deep) h += (st.hide && !st.shown.ans) ? '<button class="veil" type="button" data-veil="ans">모범답안과 차별화 포인트 가려짐 · 눌러서 보기</button>' : ansCard(d) + diffCard(d);
    h += `${joinLine()}<p class="credit">${esc(B.site.credit)}</p></div>`;
    $('#view').innerHTML = h + topicPager(t, true);
  };
  const d = cache['t/' + t.tid];
  if (d){ paint(d); return; }
  $('#view').innerHTML = head(null) + '<p class="loading">요약을 불러오는 중입니다</p>';
  const tk = st.token;
  load('t/' + t.tid).then(doc => { if (tk === st.token) paint(doc); }).catch(() => { if (tk === st.token) $('#view').innerHTML = head(null) + '<div class="empty"><b>요약을 불러오지 못했습니다</b><p>인터넷 연결을 확인하고 다시 열어 주세요.</p></div>'; });
}

const ROAD = [
  [1, '통합목차', '과목 전체 표, 계열 화면, 토픽 화면'],
  [1, '토픽 교재와 암기 요약', ''],
  [1, '서브노트', '암기 요약만 모아 빠르게 회독'],
  [0, '계열 가이드', '핵심 비교, 변형 예측, 연결 질문'],
  [0, '강의슬라이드', '계열마다 한 벌. 토픽맵에서 기출 변형까지'],
  [0, '문항집', '주간모의고사, 퀴즈, 타임어택'],
  [0, '기수 주간 세트', '그 주에 풀 문항 묶음과 진행']
];
const slogan = () => { const x = B.site.slogan; return `<b class="sl"><i class="z">${esc(x[0])}</i>${esc(x[1])}<i class="u">${esc(x[2])}</i></b>`; };
function roadHtml(){
  const open = B.topics.filter(t => t.st).length;
  const xs = xOpenSets();          // 문항집은 공개한 주간 세트가 있을 때 열림으로 바뀐다
  return '<ol class="road">' + ROAD.map(x => (x[1] === '문항집' && xs) ? [1, x[1], `주간모의고사 ${xs}주간. 퀴즈와 타임어택은 다음`] : x).map(x => `<li${x[0] ? ' class="on"' : ''}><em>${x[0] ? '열림' : '다음'}</em><b>${x[1]}</b><span>${x[1] === '토픽 교재와 암기 요약' ? `지금 ${open}편. 계열 순서대로 채워 갑니다` : x[2]}</span></li>`).join('') + '</ol>';
}
function weekChips(w){ return '<div class="fchips">' + w.fams.map(no => `<a class="fchip${F[no] && F[no].open ? ' has' : ''}" href="#${no}" title="${esc(F[no] ? F[no].name : '')}">${esc(no)}</a>`).join('') + '</div>'; }
function homeView(){
  const all = B.topics, open = all.filter(t => t.st).length, last = T[store.get('zu-last')];
  const ex = B.exam, dd = Math.round((ms(ex.date) - todayMs()) / DAY), wk = currentWeek();
  let h = '<section class="hero"><div class="hero-l">';
  h += `<p class="slogan">${slogan()}<span>${esc(B.site.slogan_sub)}</span></p>`;
  h += `<h1>${em3(B.site.hero.h1)}</h1>`;
  h += `<p class="lead">${fill(B.site.hero.lead)}</p>`;
  h += '<div class="cta">' + (last && last.st ? `<a class="btn pri" href="#${last.tid}">이어서 보기<small>${esc(last.short)}</small></a><a class="btn" href="#toc">통합목차</a>` : '<a class="btn pri" href="#toc">통합목차 열기</a>') + '<a class="btn" href="#note">서브노트</a><a class="btn line" href="#about">심화반 안내</a></div>';
  h += `<div class="nums"><div><b>${all.length.toLocaleString()}</b><span>토픽</span></div><div><b>${all.filter(t => t.must).length.toLocaleString()}</b><span>필수 세트</span></div><div><b>${all.filter(t => t.hits).length.toLocaleString()}</b><span>기출 있는 토픽</span></div><div class="hot"><b>${open}</b><span>교재 공개</span></div></div>`;
  h += `<p class="numnote">${B.order.length}과목 ${B.fams.length}계열입니다. 필수 세트는 최근 기출이 많아 기출 점수가 높은 토픽(S·A 등급)과 2027년 출제기준에 새로 들어온 토픽이고, 기출 있는 토픽은 ${B.span[0]}~${B.span[1]}회에 한 번 이상 나온 토픽입니다. 나머지는 기출은 없지만 계열을 채우는 형제 토픽입니다.</p>`;
  h += '</div><aside class="term">';
  h += `<div class="term-h"><b>${esc(B.term)} · ${ex.round}회 대비</b><a href="#term">전체 일정 →</a></div>`;
  h += `<div class="dday"><b>${dd > 0 ? 'D-' + dd : (dd === 0 ? 'D-DAY' : '시험 종료')}</b><span>${ex.round}회 필기 ${ex.tentative ? '예정일' : '시험일'}<br>${esc(ymd(ex.date))}</span></div>`;
  if (wk){
    const now = weekState(wk, todayMs()) === 'now';
    h += `<div class="wk"><span class="when">${now ? '이번 주' : '다음 일정'} ${weekRange(wk.date)}</span><b>${esc(wk.theme)}</b>`;
    h += `<p>${wk.type === '자습' ? '자습 주' + (wk.kpc ? ' · ' + esc(wk.kpc) : '') : md(ms(wk.date)) + '(토) 강의'}${wk.fams.length ? ` · ${wk.fams.length}계열 ${wk.topics}토픽` : ''}</p>`;
    if (wk.fams.length) h += weekChips(wk);
    h += xWeekLine(wk);
    h += '</div>';
  }
  h += '</aside></section>';

  h += bookBlock();

  h += '<section><div class="sec-h"><h2>과목</h2><p>막대는 토픽의 역할 구성입니다. 과목을 누르면 전체 표가 열립니다.</p></div><div class="sgrid">';
  B.order.forEach(c => {
    const s = S[c], list = s.fams.reduce((a, f) => a.concat(f.list), []), op = list.filter(t => t.st).length;
    const dates = Array.from(new Set(s.fams.map(f => f.date).filter(Boolean))).sort().map(d => md(ms(d)));
    h += `<a class="scard" href="#toc.${c}"><div class="sc-top"><span class="sc-code">${esc(c)}</span><span class="sc-open">${op ? `교재 <b>${op}</b> / ${list.length}` : '교재 준비 중'}</span></div><b class="sc-name">${esc(s.name)}</b>`
      + `<div class="rbar" aria-hidden="true">${ROLES.map((x, i) => { const n = list.filter(t => t.role === x).length; return n ? `<i class="r${i}" style="flex:${n}"></i>` : ''; }).join('')}</div>`

      + (dates.length ? `<div class="sc-week">${esc(B.term)} ${dates.join(' · ')}</div>` : '') + '</a>';
  });
  h += '</div></section>';

  h += '<section><div class="sec-h"><h2>회독 순서</h2><p>토픽마다 붙은 역할 표시는 읽는 순서입니다.</p></div><div class="roles">';
  ROLES.forEach((x, i) => { h += `<div class="rolebox r${i}"><div class="rh"><b>${i < 4 ? (i + 1) + '. ' : ''}${x}</b><span>${all.filter(t => t.role === x).length}</span></div><p>${ROLE_DESC[i]}</p></div>`; });
  h += `</div><p class="rolenote"><b>필수</b> 표시는 회독할 때 먼저 고를 ${all.filter(t => t.must).length}토픽입니다. 기출 점수가 높은 토픽(S·A 등급)과 2027년 출제기준 신규 토픽이 여기에 듭니다. 교재의 내용과 분량은 필수 여부나 역할과 관계없이 같은 기준으로 씁니다.</p></section>`;

  h += '<section class="two-col">';
  if (B.revs.length) h += '<div><div class="sec-h"><h2>최근에 올리거나 고친 교재</h2></div><div class="revs">' + B.revs.map(x => { const t = T[x[0]]; return t ? `<a href="#${t.tid}"><time>${esc(ymd(x[2]))}</time><b>${esc(t.short)}<small>개정 ${x[1]}</small></b><span>${esc(x[3])}</span></a>` : ''; }).join('') + '</div></div>';
  h += '<div><div class="sec-h"><h2>열리는 순서</h2></div>' + roadHtml() + '</div></section>';
  h += joinBand();
  h += `<p class="legend">마지막 빌드 ${esc(ymd(B.built))} · 통합목차 ${esc(B.toc)}</p>`;
  $('#page').innerHTML = h;
}

/* ---------- 통합교재 소개, 심화반 안내, 문의 (글은 engine/site/site.json) ---------- */
const em3 = a => esc(a[0]) + '<em>' + esc(a[1]) + '</em>' + esc(a[2] || '');
const arrow = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h10M10 5l4 4-4 4"></path></svg>';
function bookBlock(){
  const k = B.site.book;
  const row = (x, c) => `<div class="zrow ${c}"><div class="zl"><b>${esc(x.label)}</b><span>${esc(x.note)}</span></div><ol class="zsteps">` + x.steps.map((s, i) => {
    const last = c === 'up' && i === x.steps.length - 1, body = `<b>${fill(s[0])}</b><em>${fill(s[1])}</em><span>${fill(s[2])}</span>`;
    return `<li${last ? ' class="go"' : ''}>${i ? arrow : ''}${last ? `<a href="#about">${body}</a>` : `<div>${body}</div>`}</li>`;
  }).join('') + '</ol></div>';
  return `<section class="bookx"><div class="bx-h"><p class="eyebrow">${esc(k.name)}</p><h2>${esc(k.head)}</h2><p>${fill(k.lead)}</p></div>`
    + `<div class="zbox">${row(k.zip, 'zip')}${row(k.up, 'up')}</div>`
    + `<div class="bpoints">${k.points.map((x, i) => `<div><i>${i + 1}</i><b>${fill(x[0])}</b><p>${fill(x[1])}</p></div>`).join('')}</div></section>`;
}
function contactBox(){
  const c = B.site.contact, m = B.site.mentor;
  return `<div class="cbox"><div class="cb-l"><h2>${esc(c.h)}</h2><p>${esc(c.lead)}</p><p class="cb-m"><b>${esc(m.name)}</b><span>${esc(m.title)} · ${esc(m.role)}</span></p></div>`

    + `<div class="cb-row"><span>카페</span><a href="${esc(c.cafe.url)}" target="_blank" rel="noopener noreferrer">${esc(c.cafe.name)}</a><small>${esc(c.cafe.note)} · ${esc(c.cafe.label)}</small></div>`
    + `<p class="cb-n">${esc(c.members)}</p></div></div>`;

  h += `<section class="two-col even"><div><div class="sec-h"><h2>${esc(a.day.h)}</h2></div><ol class="tline">${a.day.items.map(i => `<li><time>${esc(i[0])}</time><b>${esc(i[1])}</b><span>${esc(i[2])}</span></li>`).join('')}</ol></div>`
    + `<div><div class="sec-h"><h2>${esc(a.week.h)}</h2></div><ol class="tline wk">${a.week.items.map(i => `<li><time>${esc(i[0])}</time><b>${esc(i[1])}</b><span>${esc(i[2])}</span></li>`).join('')}</ol></div></section>`;

  h += bookBlock();

/* 메일 주소 복사: 막힌 화면에서는 직접 고르도록 알린다 */
function copyText(txt, btn){
  const say = ok => { const o = btn.dataset.label || btn.textContent; btn.dataset.label = o; btn.textContent = ok ? '복사했습니다' : '주소를 길게 눌러 복사해 주세요'; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = o; }, ok ? 1800 : 3200); };
  const old = () => { try { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); say(ok); } catch(e){ say(false); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => say(true), old); else old();
}

/* ---------- 주소와 화면 전환 ---------- */
const VIEW = { toc: tocView, fam: famView, topic: topicView, note: noteView, notefam: noteFamView, notetopic: noteTopicView };
const PAGE = { home: homeView, term: termView, slides: soonView, items: soonView, about: aboutView };
function parse(h){
  h = String(h || '').replace(/^#/, '');
  let m;
  if ((m = /^(T[PN]-\d{4})(\.sum)?$/.exec(h)) && T[m[1]]) return { v: 'topic', tid: m[1], tab: m[2] ? 'sum' : 'doc' };
  if (h === 'toc') return { v: 'toc', subj: st.subj };
  if ((m = /^toc\.([A-Z]+)$/.exec(h)) && S[m[1]]) return { v: 'toc', subj: m[1] };
  if (F[h]) return { v: 'fam', no: h };
  if ((m = /^([A-Z]+-\d\d)\.guide$/.exec(h)) && F[m[1]]) return { v: 'fam', no: m[1], tab: 'guide' };
  if (h === 'note') return { v: 'note', subj: st.subj };
  if ((m = /^note\.(.+)$/.exec(h))){
    if (S[m[1]]) return { v: 'note', subj: m[1] };
    if (F[m[1]]) return { v: 'notefam', no: m[1] };
    if (T[m[1]]) return { v: 'notetopic', tid: m[1] };
  }
  if ((m = xParse(h))) return m;
  if (PAGE[h] && h !== 'home') return { v: h };
  return { v: 'home' };
}
function route(h, keep){
  const r = parse(h), prev = st.route;
  r.mode = r.v.indexOf('note') === 0 ? 'note' : (r.v.charAt(0) === 'x' ? 'items' : 'toc'); xRoute(r);
  if (r.tid) r.no = T[r.tid].no;
  if (r.no){ st.subj = F[r.no].subj; st.exp[r.no] = true; }
  if (r.subj) st.subj = r.subj;
  store.set('zu-subj', st.subj);
  if (!prev || prev.tid !== r.tid || prev.no !== r.no || prev.v !== r.v){ st.shown = {}; st.core = false; }
  st.route = r; st.token++;
  closePop(); closeFind();
  document.querySelectorAll('[data-m]').forEach(a => {
    const on = (a.dataset.m === 'toc' && (r.v === 'toc' || r.v === 'fam' || r.v === 'topic')) || (a.dataset.m === 'note' && r.mode === 'note') || (a.dataset.m === 'items' && r.mode === 'items') || a.dataset.m === r.v;
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const two = !!VIEW[r.v];
  $('#wrap').hidden = !two; $('#page').hidden = two;
  if (two){ renderTree(); renderSubjBar(); VIEW[r.v](r); if (mq.matches) $('#side').open = false; }
  else PAGE[r.v](r);
  if (!keep) window.scrollTo(0, 0);
  spy();
}
function nav(h, replace){
  st.hash = h;
  try { if (replace) history.replaceState(null, '', '#' + h); else if (location.hash !== '#' + h) location.hash = h; } catch(e){}
  route(h, replace);
}
const rerender = () => route(st.hash, true);
window.addEventListener('hashchange', () => { const h = location.hash.replace(/^#/, ''); if (h !== st.hash){ st.hash = h; route(h); } });

/* 절 목차: 지금 읽는 절 표시 */
function spy(){
  const toc = $('.toc'); if (!toc) return;
  const secs = Array.from(document.querySelectorAll('.doc section')); let cur = 0;
  secs.forEach((s, k) => { if (s.getBoundingClientRect().top <= 90) cur = k; });
  toc.querySelectorAll('button').forEach((b, k) => { if (k === cur) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  const on = toc.children[cur];
  if (on && (on.offsetLeft < toc.scrollLeft || on.offsetLeft + on.offsetWidth > toc.scrollLeft + toc.clientWidth)) toc.scrollLeft = on.offsetLeft - 20;
}
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });

/* ---------- 링크 미리 보기 ---------- */
let pop = null, popFrom = null;
function closePop(){ if (pop){ pop.remove(); pop = null; if (popFrom && document.contains(popFrom)) popFrom.focus({ preventScroll: true }); popFrom = null; } }
function openPop(a){
  closePop();
  const ref = a.dataset.ref, fam = a.dataset.fam; let h = '';
  if (ref){
    const x = T[ref]; if (!x) return;
    const f = F[x.no], here = st.route.tid === ref && st.route.v === 'topic';
    h = `<p class="pk">${esc(x.no)} ${esc(f.name)}</p><h3>${esc(x.name)}</h3><div class="tmeta"><span class="chip role ${x.rc}">${esc(x.role)}</span>${x.must ? '<span class="chip must">필수</span>' : ''}<span class="chip">${hits(x)}</span></div>`;
    h += x.st ? '<p class="pd" data-popdef="1">한 줄 정의를 불러오는 중입니다</p>' : '<p class="pn">이 토픽의 교재는 준비 중입니다. 공개되면 여기에 한 줄 정의가 보입니다.</p>';
    h += '<div class="pa">' + (here ? '<span class="pn">지금 보고 있는 토픽입니다</span>' : (x.st ? `<a class="go" href="#${ref}">교재 열기</a><a class="alt" href="#${ref}.sum">암기 요약</a>` : `<a class="alt" href="#${x.no}">계열 화면</a>`)) + '<button class="x" type="button" data-close="1">닫기</button></div>';
  } else {
    const f = F[fam]; if (!f) return;
    h = `<p class="pk">계열</p><h3>${esc(f.no)} ${esc(f.name)}</h3><div class="tmeta"><span class="chip">토픽 <b>${f.n}</b>개</span><span class="chip">필수 <b>${f.must}</b>개</span>${f.open ? `<span class="chip">교재 <b>${f.open}</b>편</span>` : ''}</div><div class="pa"><a class="go" href="#${f.no}">계열 화면 열기</a><button class="x" type="button" data-close="1">닫기</button></div>`;
  }
  pop = document.createElement('div'); pop.className = 'pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', '링크 미리 보기'); pop.innerHTML = h;
  document.body.appendChild(pop); popFrom = a;
  const place = () => {
    if (!pop) return;
    const rc = a.getBoundingClientRect(), w = pop.offsetWidth, ph = pop.offsetHeight;
    let left = rc.left + window.scrollX, top = rc.bottom + window.scrollY + 8;
    left = Math.max(12, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 12));
    if (rc.bottom + ph + 16 > window.innerHeight && rc.top - ph - 8 > 0) top = rc.top + window.scrollY - ph - 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  };
  place();
  const first = pop.querySelector('a,button'); if (first) first.focus({ preventScroll: true });
  if (ref && T[ref].st){
    const mine = pop;
    load('f/' + T[ref].no).then(fd => { const el = mine === pop && pop.querySelector('[data-popdef]'); if (el){ el.textContent = (fd.defs && fd.defs[ref]) || ''; place(); } })
      .catch(() => { const el = mine === pop && pop.querySelector('[data-popdef]'); if (el) el.remove(); });
  }
}

/* ---------- 토픽 찾기 ---------- */
const qin = $('#q'), qlist = $('#qlist'); let qcur = -1, qres = [];
function closeFind(){ qlist.hidden = true; qcur = -1; }
function paintFind(){
  const q = qin.value.trim().toLowerCase();
  if (!q){ closeFind(); return; }
  const score = t => { const n = t.name.toLowerCase(); const i = n.indexOf(q); return i < 0 ? (t.tid.toLowerCase() === q ? 0 : -1) : (i === 0 ? 0 : 1); };
  qres = B.topics.map(t => [score(t), t]).filter(x => x[0] >= 0).sort((a, b) => (a[0] - b[0]) || (b[1].st - a[1].st) || (b[1].hits - a[1].hits)).slice(0, 14).map(x => x[1]);
  qlist.innerHTML = qres.length ? qres.map((t, i) => `<a role="option" class="${t.st ? 'open' : ''}${i === qcur ? ' cur' : ''}" href="#${t.tid}"><b>${esc(t.name)}</b><small>${esc(t.no)} ${esc(F[t.no].name)} · ${esc(t.role)}${t.hits ? ' · 기출 ' + t.hits + '회' : ''}</small>${t.st ? '<em>교재</em>' : ''}</a>`).join('') : '<p class="none">이름에 그 말이 들어간 토픽이 없습니다</p>';
  qlist.hidden = false;
}
qin.addEventListener('input', () => { qcur = -1; paintFind(); });
qin.addEventListener('focus', () => { if (qin.value.trim()) paintFind(); });
qin.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if (!qres.length) return; e.preventDefault(); qcur = (qcur + (e.key === 'ArrowDown' ? 1 : -1) + qres.length) % qres.length; paintFind(); }
  else if (e.key === 'Enter'){ const t = qres[qcur < 0 ? 0 : qcur]; if (t && !qlist.hidden){ e.preventDefault(); qin.value = ''; qin.blur(); nav(t.tid); } }
  else if (e.key === 'Escape'){ closeFind(); }
});

async function makeImage(kind){
  const r = st.route; let title, label, inner, foot;
  if (kind === 'fam'){
    const f = F[r.no], fd = cache['f/' + f.no]; if (!fd) return;
    const list = f.list.filter(noteFilter).filter(t => fd.defs[t.tid]);
    title = f.no + ' ' + f.name; label = '한 줄 정의';
    inner = `<div class="xp-top"><b>ZIP-UP 정보관리기술사 심화반</b><span>${esc(S[f.subj].name)}</span></div><h3>${esc(f.no)} ${esc(f.name)}</h3>` + list.map(t => `<div class="xrow"><b>${esc(t.short)}</b><span>${esc(fd.defs[t.tid])}</span></div>`).join('');
    foot = `한 줄 정의 ${list.length}개 · ${ymd(B.built)}`;
  } else {
    const t = T[r.tid], d = cache['t/' + t.tid]; if (!d) return;
    const core = kind === 'ans' && st.core, f = F[t.no];
    label = kind === 'sum' ? '요약 카드' : (core ? '모범답안 1페이지 분량' : '모범답안'); title = t.short;
    inner = `<div class="xp-top"><b>ZIP-UP 정보관리기술사 심화반</b><span>${esc(f.no)} ${esc(f.name)}</span></div><h3>${esc(t.name)}</h3><div class="tmeta">${metaRow(t, null)}</div>`
      + (kind === 'sum' ? sumCard(t, d, true, false) : `<div class="answrap${core ? ' core' : ''}">${d.sum.ans}</div>`);
    foot = label + (d.rev ? ` · 개정 ${d.rev.n} (${ymd(d.rev.date)})` : '');
  }
  const o = showOvl(`${title} · ${label}`), body = $('.ovl-b', o), msg = $('#ovlmsg', o);
  if (typeof html2canvas !== 'function'){ body.innerHTML = '<p>그림을 만드는 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.</p>'; return; }
  const host = $('#xphost');
  host.innerHTML = `<div class="xp">${inner}<div class="xp-foot">${esc(foot)}<br>${esc(B.site.credit)}<br>수강 문의 ${esc(B.site.contact.email)}</div></div>`;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(host.firstElementChild, { scale: 2.7, backgroundColor: '#FFFFFF', logging: false });
    host.innerHTML = '';
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('empty');
    const url = URL.createObjectURL(blob), name = `ZIPUP_${title}_${label}.png`.replace(/[\s·\/]+/g, '_');
    body.innerHTML = `<img alt="${esc(title)} ${esc(label)}" src="${url}">`;
    const save = $('#ovlsave', o); save.hidden = false;
    save.addEventListener('click', async () => {
      const dl = await downloadsP;
      if (dl){
        try { await dl.save({ filename: name, data: blob }); msg.textContent = '저장했습니다.'; }
        catch(e){ msg.textContent = e && e.code === 'declined' ? '저장을 취소했습니다.' : '이 화면에서는 바로 저장할 수 없습니다. 그림을 길게 누르거나 오른쪽 단추로 눌러 저장해 주세요.'; }
      } else {
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        msg.textContent = '저장을 시작했습니다. 받지 못했다면 그림을 길게 누르거나 오른쪽 단추로 눌러 저장해 주세요.';

  } catch(e){
    host.innerHTML = '';
    body.innerHTML = '<p>그림을 만들지 못했습니다. 다시 눌러 주세요.</p>';

/* ---------- 누르기 ---------- */
document.addEventListener('click', e => {
  const el = e.target;
  if (!el.closest) return;
  if (el.closest('[data-close]')){ closePop(); return; }
  if (el.closest('[data-ovlclose]') || (el.classList && el.classList.contains('ovl'))){ closeOvl(); return; }
  if (!el.closest('.find')) closeFind();
  const ref = el.closest('[data-ref],[data-fam]');
  if (ref){ e.preventDefault(); if (popFrom === ref) closePop(); else openPop(ref); return; }
  const a = el.closest('a[href^="#"]');
  if (a){
    e.preventDefault();
    const h = a.getAttribute('href').slice(1);
    if (a.dataset.famrow && h === st.hash){ st.exp[a.dataset.famrow] = !st.exp[a.dataset.famrow]; renderTree(); return; }
    if (a.closest('.find-list')) qin.value = '';
    nav(h);
    return;
  }
  if (pop && !el.closest('.pop')) closePop();
  const d = (k) => { const x = el.closest('[' + k + ']'); return x ? x.getAttribute(k) : null; };
  let v;
  if ((v = d('data-copy'))){ copyText(v, el.closest('[data-copy]')); return; }
  if ((v = d('data-tab'))){ nav(st.route.tid + (v === 'sum' ? '.sum' : ''), true); return; }
  if ((v = d('data-sec'))){ const s = document.getElementById(v); if (s) s.scrollIntoView(); return; }
  if ((v = d('data-veil'))){ st.shown[v] = true; rerender(); return; }
  if ((v = d('data-core'))){ st.core = v === '1'; rerender(); return; }
  if ((v = d('data-deep'))){ st.deep = v === '1'; store.set('zu-deep', st.deep ? '1' : '0'); rerender(); return; }
  if ((v = d('data-img'))){ makeImage(v); return; }
  if (d('data-hide')){ st.hide = !st.hide; st.shown = {}; store.set('zu-hide', st.hide ? '1' : '0'); rerender(); return; }
  if ((v = d('data-ts'))){ st.tSort = v; rerender(); return; }
  if ((v = d('data-tf'))){ st[v] = !st[v]; rerender(); return; }
  if ((v = d('data-tr')) !== null){ st.tRole = +v; rerender(); return; }
  if ((v = d('data-fs'))){ st.fSort = v; rerender(); return; }
  if ((v = d('data-nf'))){ st[v] = !st[v]; rerender(); return; }
});
document.addEventListener('change', e => { if (e.target && e.target.id === 'subjsel'){ const c = e.target.value; nav((st.route.mode === 'note' ? 'note.' : 'toc.') + c); } });

/* ===== 문항집: 주간모의고사 =====
   tools/build_site.py 가 app.js 의 EXAM 자리에 이 파일을 넣는다. app.js 안의 것($, esc, st, B, T, F, VIEW, nav, load, cache ...)을 그대로 쓴다.
   자료: data/x/index.js      문항 목록과 세트 (처음에 목차와 함께 불러온다). 문항은 한 번만 두고, 세트(주간 1개)는 문항 ID 목록만 가진다
         data/x/{세트 ID}.js  그 세트의 2교시형 문제 본문 (시험지나 문항을 열 때)
         data/x/{문항 ID}.js  그 문항의 교재와 모범답안 (문항을 열 때)
   공개한 세트가 없으면 문항집은 "준비 중" 화면 그대로다. 선정 근거는 화면 자료에 싣지 않는다.
   주소: #items (주간별)  #items.fam  #items.SE-01 (계열별)  #items.form  #items.f1 (교시별)
         #set.4-1010 (한 주간의 시험지)  #EX-0036 (문항, 교재)  #EX-0036.ans (문항, 모범답안) */
let XD = { terms: [], sets: [], items: [] };
const XS = {}, XQ = {}, XT = {}, XF = {};
const XGA = ['가', '나', '다', '라', '마'];
const XPICK = { p1: 10, p2: 4 };                       // 과제에서 골라 쓰는 문항 수
const XSTATE = { past: '지난 주간', now: '이번 주간', next: '다음 주간' };
let xReady = false;
st.xview = 'week';
function xPrep(){
  if (xReady || !cache['x/index']) return;
  xReady = true; XD = cache['x/index'];
  document.querySelectorAll('.menu a[data-m="items"]').forEach(a => a.classList.remove('soon'));
  XD.sets.forEach(s => {
    XS[s.id] = s; s.all = s.t1.concat(s.t2, s.rs);
    s.w = B.weeks.find(w => w.date === s.date) || { date: s.date, theme: '', fams: s.fams, topics: 0, type: '정규' };
  });
  XD.items.forEach(q => {
    XQ[q.id] = q; (XF[q.fam] = XF[q.fam] || []).push(q);
    q.tp.forEach(x => { (XT[x[0]] = XT[x[0]] || []).push(q); });
  });
}
const xGrp = q => q.g ? '출제예상' : '과제';
const xForm = q => q.f === 1 ? '1교시형' : '2교시형';
const xPts = q => q.f === 1 ? 10 : 25;
const xFc = q => q.f === 1 ? 'r2' : 'r3';
const xNo = q => q.g ? `출제예상 ${q.n}번` : `과제 ${xForm(q)} ${q.n}번`;
const xWhen = s => weekRange(s.date);
const xTheme = s => s.w.theme.replace(/\s*\(강의 완료\)\s*$/, '');
const xState = s => weekState(s.w, todayMs());
const xDue = s => md(ms(s.date) - DAY) + '(금)';
const xTermName = s => (XD.terms.find(t => t.id === s.term) || { name: B.term }).name;
const xCount = s => { const n1 = s.all.filter(id => XQ[id].f === 1).length; return [s.t1.length + s.t2.length, s.rs.length, n1, s.all.length - n1]; };

/* ---------- 주소 ---------- */
function xParse(h){
  xPrep(); let m;
  if (!XD.sets.length) return null;
  if (h === 'items') return { v: 'xhome', sub: 'week' };
  if (h === 'items.fam') return { v: 'xhome', sub: 'fam' };
  if (h === 'items.form') return { v: 'xhome', sub: 'form' };
  if ((m = /^items\.f([12])$/.exec(h))) return { v: 'xhome', sub: 'form', form: +m[1] };
  if ((m = /^items\.([A-Z]+-\d\d)$/.exec(h)) && XF[m[1]]) return { v: 'xhome', sub: 'fam', fno: m[1] };
  if ((m = /^set\.(\d+-\d{4})$/.exec(h)) && XS[m[1]]) return { v: 'xset', sid: m[1] };
  if ((m = /^(EX-\d{4})(\.ans)?$/.exec(h)) && XQ[m[1]]) return { v: 'xitem', qid: m[1], tab: m[2] ? 'ans' : 'doc' };
  return null;
}
function xRoute(r){
  if (r.mode !== 'items') return;
  if (r.v === 'xhome') st.xview = r.sub;
  if (r.v === 'xset'){ st.xview = 'week'; st.exp['x:' + r.sid] = true; }
  if (r.v === 'xitem' && (!st.route || st.route.qid !== r.qid)) st.core = false;
  if (r.v === 'xitem'){ const q = XQ[r.qid]; r.sid = q.set; st.exp[st.xview === 'fam' ? 'xf:' + q.fam : (st.xview === 'form' ? 'xm:' + q.f : 'x:' + q.set)] = true; }   // 지금 보는 차례에서만 펼친다
  if (r.fno) st.exp['xf:' + r.fno] = true;
  if (r.form) st.exp['xm:' + r.form] = true;
}

/* ---------- 맨 위 카드 줄: 문항집의 세 종류 ---------- */
function xBar(){
  const bar = $('#subjbar'), show = st.route.v === 'xhome';
  bar.hidden = !show; if (!show){ bar.innerHTML = ''; return; }
  const n1 = XD.items.filter(q => q.f === 1).length;
  bar.innerHTML = `<a class="sbc on" href="#items" aria-current="page"><span class="sb-top"><i>주간</i><em>문항 ${XD.items.length}</em></span><b>주간모의고사</b><small>${XD.sets.length}주간 · 1교시형 ${n1} · 2교시형 ${XD.items.length - n1}</small></a>`
    + '<span class="sbc off"><span class="sb-top"><i>퀴즈</i><em>준비 중</em></span><b>인터랙티브 퀴즈</b><small>토요일 09:00 · 지난주 계열</small></span>'
    + '<span class="sbc off"><span class="sb-top"><i>어택</i><em>준비 중</em></span><b>타임어택</b><small>1교시형 10분 · 2교시형 25분</small></span>';
}

/* ---------- 차례: 주간별, 계열별, 교시별 ---------- */
function xTree(){
  const r = st.route, v = st.xview;
  const pill = (k, label, href) => `<a href="#${href}"${v === k ? ' aria-current="page"' : ''}>${label}</a>`;
  const qrow = (q, cls, tag) => `<li><a class="tp${q.d ? ' has' : ' off'}" href="#${q.id}"${q.id === r.qid ? ' aria-current="page"' : ''}><i class="rt xn ${cls}">${tag}</i><span>${esc(q.t)}</span>${q.d ? '<b class="tdot" title="교재와 모범답안이 열린 문항"></b>' : ''}</a></li>`;
  const gh = x => `<li class="xgh">${x}</li>`;
  let h = `<div class="subj xsubj"><span>주간모의고사</span><small>${XD.items.length}문항</small></div>`;
  h += `<div class="treetop">${pill('week', '주간별', 'items')}${pill('fam', '계열별', 'items.fam')}${pill('form', '교시별', 'items.form')}</div><ul class="tree">`;
  let foot = '', where = '';
  if (v === 'week'){
    XD.terms.forEach(t => {
      const sets = XD.sets.filter(s => s.term === t.id);
      h += `<li class="sub-h">${esc(t.name)}${t.id === XD.sets[0].term ? ` · ${B.exam.round}회 대비` : ''}</li>`;
      if (t.wait) h += `<li class="none">${esc(t.wait)}</li>`;
      sets.slice().reverse().forEach(s => {
        const key = 'x:' + s.id, exp = !!st.exp[key], here = r.sid === s.id, cur = here && r.v === 'xset', ws = xState(s);
        h += `<li><a class="fam${cur ? ' cur' : (here ? ' open' : '')}" href="#set.${s.id}" data-famrow="${key}" aria-expanded="${exp}">${chev(exp)}<span class="fn"><em class="xwk">${xWhen(s)}</em>${esc(xTheme(s))}</span>${ws === 'now' ? '<small class="xnow">이번 주</small>' : `<small>${s.all.length}</small>`}</a>`;
        if (exp){
          h += '<ul>' + gh(`과제 · 1교시형 ${s.t1.length}`) + s.t1.map(id => qrow(XQ[id], 'r2', XQ[id].n)).join('')
            + gh(`과제 · 2교시형 ${s.t2.length}`) + s.t2.map(id => qrow(XQ[id], 'r3', XQ[id].n)).join('')
            + gh(`출제예상문항 ${s.rs.length}`) + s.rs.map(id => qrow(XQ[id], xFc(XQ[id]), XQ[id].n)).join('') + '</ul>';
        }
        h += '</li>';
      });
    });
    foot = '숫자는 시험지의 문항 번호입니다. 청록은 1교시형(10점), 보라는 2교시형(25점)입니다. <b class="tdot"></b> 점이 붙고 이름이 밝은 문항은 교재와 모범답안이 열린 문항이고, 흐린 이름은 준비하고 있는 문항입니다.';
    const s = r.sid ? XS[r.sid] : null, q = r.qid ? XQ[r.qid] : null;
    where = '주간별' + (s ? ' › ' + xWhen(s) + (q ? ' › ' + xNo(q) : '') : '');
  } else if (v === 'fam'){
    B.order.forEach(c => {
      const fs = S[c].fams.filter(f => XF[f.no]); if (!fs.length) return;
      h += `<li class="sub-h">${esc(c)} ${esc(S[c].name)}</li>`;
      fs.forEach(f => {
        const key = 'xf:' + f.no, exp = !!st.exp[key], q0 = r.qid ? XQ[r.qid] : null, here = (q0 && q0.fam === f.no) || r.fno === f.no, cur = r.fno === f.no;
        h += `<li><a class="fam${cur ? ' cur' : (here ? ' open' : '')}" href="#items.${f.no}" data-famrow="${key}" aria-expanded="${exp}">${chev(exp)}<span class="fn"><em>${esc(f.no)}</em>${esc(f.name)}</span><small>${XF[f.no].length}</small></a>`;
        if (exp) h += '<ul>' + XF[f.no].map(q => qrow(q, xFc(q), q.f === 1 ? '1교시' : '2교시')).join('') + '</ul>';
        h += '</li>';
      });
    });
    foot = '숫자는 그 계열을 묻는 문항 수입니다. 문항은 주 토픽의 계열에 한 번만 둡니다. <b class="tdot"></b> 점이 붙고 이름이 밝은 문항은 교재와 모범답안이 열린 문항이고, 흐린 이름은 준비하고 있는 문항입니다.';
    const f = r.fno ? F[r.fno] : (r.qid ? F[XQ[r.qid].fam] : null);
    where = '계열별' + (f ? ' › ' + f.no + ' ' + f.name : '');
  } else {
    [1, 2].forEach(k => {
      const key = 'xm:' + k, exp = !!st.exp[key], q0 = r.qid ? XQ[r.qid] : null, here = (q0 && q0.f === k) || r.form === k, cur = r.form === k;
      const n = XD.items.filter(q => q.f === k).length;

        });
        h += '</ul>';
      }
      h += '</li>';

    foot = '1교시형은 10점에 답안 1페이지, 2교시형은 25점에 답안 3.5페이지입니다. <b class="tdot"></b> 점이 붙고 이름이 밝은 문항은 교재와 모범답안이 열린 문항이고, 흐린 이름은 준비하고 있는 문항입니다.';
    where = '교시별' + (r.form ? ' › ' + r.form + '교시형' : '');

  h += `</ul><p class="treefoot">${foot}</p>`;
  $('#tree').innerHTML = h;

/* ---------- 필요한 자료를 불러온 뒤에 그린다 ---------- */
function xNeed(keys, head, paint){
  const miss = keys.filter(k => !cache[k]);
  if (!miss.length){ paint(); return; }
  $('#view').innerHTML = head + '<p class="loading">문항을 불러오는 중입니다</p>';
  const tk = st.token;
  Promise.all(miss.map(load)).then(() => { if (tk === st.token){ paint(); spy(); } })
    .catch(() => { if (tk === st.token) $('#view').innerHTML = head + '<div class="empty"><b>문항을 불러오지 못했습니다</b><p>인터넷 연결을 확인하고 다시 열어 주세요.</p></div>'; });
}
function xStems(s){          // 세트 파일의 문제 본문을 문항에 붙인다
  const d = cache['x/' + s.id]; if (!d || s.full) return;
  s.full = true; Object.keys(d.q).forEach(id => { if (XQ[id]) Object.assign(XQ[id], d.q[id]); });
}
function xFull(q){           // 문항 파일의 교재와 모범답안을 문항에 붙인다
  const d = cache['x/' + q.id]; if (d && !q.doc) Object.assign(q, d);
}

/* ---------- 문제 (시험지와 문항 화면이 함께 쓴다) ---------- */

function xPaper(s, part, forImage){

    : part === 'p2' ? ['2교시형', `${qs.length}문 중 ${XPICK.p2}문 선택 · 각 25점 · 100분`, `※ 다음 문제 중 ${XPICK.p2}문제를 선택하여 설명하시오. (각 25점)`]
    : ['출제예상문항', `${qs.length}문 · 1교시형 ${n1} · 2교시형 ${qs.length - n1}`, `※ 과제 밖에서 공부할 문항입니다.${n1 && n1 < qs.length ? ` 1~${n1}번은 1교시형(각 10점), ${n1 + 1}~${qs.length}번은 2교시형(각 25점)입니다.` : ''}`];

  /* 슬라이드 차례: 토픽 한눈에 보기와 같은 틀 (단계 제목, 카드) */
  const zsBody = function(f, fd){
    const x = slideOf(f.no), chip = p => `<a class="bk" href="${x.file}#${p[0]}"><i class="zs-n">${p[0]}</i>${esc(p[1])}</a>`;
    const blk = (head, sub, mark, rows) => `<section class="stg"><div class="stg-h"><b>${esc(head)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}${mark || ''}</div><div class="olist">${rows}</div></section>`;
    const plain = (name, ps) => `<div class="orow zs-row"><div class="on"><b>${esc(name)}</b></div><div class="od zs-chips">${ps.map(chip).join('')}</div><div class="oh"></div></div>`;
    let h = `<div class="zs-bar"><div class="tmeta"><span class="chip">장 <b>${x.slides}</b></span><span class="chip">누르는 단계 <b>${x.steps}</b></span><span class="chip">약 <b>${x.minutes}</b>분</span><span class="chip rev">${md(ms(x.built))} 고침</span><span class="chip rvw">강의 영상 준비 중</span></div><a class="btn pri" href="${x.file}#1">처음부터 보기</a></div>`;
    if (x.intro.length) h += blk('들머리', '계열 소개와 토픽맵', '', plain('계열을 여는 장', x.intro));
    const stages = (fd && fd.stages) || [['토픽', '', f.list.map(t => t.tid)]];
    stages.forEach((sg, k) => {
      const sp = x.stages[k], mark = sp ? `<a class="bk zs-sbk" href="${x.file}#${sp[0]}"><i class="zs-n">${sp[0]}</i>${esc(sp[1])}</a>` : '';
      const rows = sg[2].map(id => {
        const t = T[id], ps = x.topics[id]; if (!t || !ps) return '';
        return `<div class="orow zs-row${t.st ? ' open' : ''}"><div class="on"><b><a href="${x.file}#${id}">${esc(t.name)}</a></b><span>${tags(t)}</span></div><div class="od zs-chips">${ps.map(chip).join('')}</div><div class="oh">${t.st ? `<a href="#${id}">교재</a><a href="#${id}.sum">요약</a>` : ''}</div></div>`;
      }).join('');
      h += blk(sg[0], sg[1], mark, rows);
    });
    if (x.end.length) h += blk('계열 정리', '핵심 비교와 기출 변형', '', plain('계열을 닫는 장', x.end));
    h += '<p class="legend">번호는 슬라이드의 장 번호입니다. 누르면 그 장부터 열리고, 토픽 이름을 누르면 그 토픽의 표지 장부터 열립니다. 교재와 요약은 통합목차의 토픽 화면으로 갑니다. 슬라이드에는 강의 스크립트가 들어 있지 않습니다.</p>';
    return h;
  };
  const zsPager = function(f){
    const fs = S[f.subj].fams.filter(x => slideOf(x.no)), i = fs.indexOf(f), p = fs[i - 1], n = fs[i + 1];
    if (!p && !n) return '';
    return `<nav class="pager wide" aria-label="계열 이동">${p ? `<a href="#slides.${p.no}"><small>← 이전 계열</small><span>${esc(p.no)} ${esc(p.name)}</span></a>` : ''}${n ? `<a class="nx" href="#slides.${n.no}"><small>다음 계열 →</small><span>${esc(n.no)} ${esc(n.name)}</span></a>` : ''}</nav>`;
  };
  const zsFamPage = function(r){
    const f = F[r.no], s = S[f.subj];
    let h = `<div class="crumb"><a href="#slides.${s.code}">강의슬라이드</a><span>›</span><a href="#slides.${s.code}">${esc(s.code)} ${esc(s.name)}</a><span>›</span><span>${esc(f.no)} ${esc(f.name)}</span></div>`;
    h += `<h1 class="vhead"><span class="no">${esc(f.no)}</span>${esc(f.name)}</h1><div id="famsub"></div>`;
    h += `<div class="tmeta">${f.date ? `<span class="chip">${esc(famWhen(f))}</span>` : ''}<span class="chip">토픽 <b>${f.n}</b></span><span class="chip">필수 <b>${f.must}</b></span></div>`;
    h += `<p class="zs-go"><a href="#${f.no}">통합목차에서 이 계열 보기 →</a></p>`;
    h += '<div id="fambody"><p class="loading">계열 정보를 불러오는 중입니다</p></div>' + zsPager(f);
    $('#view').innerHTML = h;
    const tk = st.token, done = fd => {
      if (tk !== st.token) return;
      if (fd && (fd.sub || fd.lead)) $('#famsub').innerHTML = `<p class="vsub">${fd.sub ? '<b>' + esc(fd.sub) + '.</b> ' : ''}${esc(fd.lead || '')}</p>`;
      $('#fambody').innerHTML = zsBody(f, fd);
    };
    ((f.open || f.guide) ? load('f/' + f.no) : Promise.resolve(null)).then(done).catch(() => done(null));
  };
  VIEW.slides = r => (r.no ? zsFamPage(r) : zsMenu(r));

  /* 통합목차 계열 화면의 세 번째 탭 */
  const zsFam0 = famView;
  VIEW.fam = function(r){
    if (!slideOf(r.no)){ zsFam0(r); return; }
    zsFam0(r.tab === 'slides' ? Object.assign({}, r, { tab: 'list' }) : r);
    const tr = $('#view .tabrow'); if (!tr) return;
    if (r.tab === 'slides') tr.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', 'false'));
    const a = document.createElement('a'); a.className = 'tab'; a.setAttribute('role', 'tab'); a.href = '#' + r.no + '.slides';
    a.setAttribute('aria-selected', String(r.tab === 'slides')); a.textContent = '강의슬라이드';
    tr.insertBefore(a, tr.querySelector('.side-link'));
  };
  const zsPaint0 = paintFam;
  paintFam = function(f, fd, tab){
    zsPaint0(f, fd, tab);
    const r = st.route;
    if (r && r.v === 'fam' && r.tab === 'slides' && r.no === f.no && slideOf(f.no)) $('#fambody').innerHTML = zsBody(f, fd);
  };

  /* 토픽 화면: 교재·암기 요약 탭 옆의 단추 하나 */
  const zsTopic0 = paintTopic;
  paintTopic = function(t, d, tab){
    zsTopic0(t, d, tab);
    const x = slideOf(t.no), tr = $('#view .tabrow');
    if (!x || !tr || !x.topics[t.tid]) return;
    const a = document.createElement('a'); a.className = 'zs-tb'; a.href = x.file + '#' + t.tid; a.innerHTML = ZS_ICON + '<span>강의 슬라이드</span>';
    tr.insertBefore(a, tr.querySelector('.mini'));
  };
}


/* ---------- 시작 ---------- */
Promise.all([load('book'), load('x/index').catch(() => null), load('q/index').catch(() => null)]).then(([b]) => {
  prep(b); xPrep(); renderFoot();
  const sv = store.get('zu-subj'); st.subj = S[sv] ? sv : B.order[0];
  st.hash = location.hash.replace(/^#/, '');
  route(st.hash, true);
}).catch(() => { $('#page').innerHTML = '<div class="empty"><b>목차를 불러오지 못했습니다</b><p>인터넷 연결을 확인하고 화면을 다시 열어 주세요. 내려받은 폴더에서 여는 경우에는 index.html과 data 폴더가 같은 자리에 있어야 합니다.</p></div>'; });
})();

</script>
</body></html>
